<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money &amp; Banking Quiz 5 | Center JUST</title>
<style>
:root{--navy:#060E24;--gold:#D6B158;--gold2:#b8923a;--blue:#2454BE;--ok:#2454BE;--bad:#DE4040;--parch:#F6EEDB;--ink:#1d2540}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--navy);color:#F4F7FC;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 85% 0%,rgba(36,84,190,.28),transparent 55%),radial-gradient(ellipse at 0% 100%,rgba(214,177,88,.08),transparent 50%),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}
.serif{font-family:Georgia,"Times New Roman",serif}
.screen{display:none;animation:fade .45s ease}.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero{text-align:center;padding:18px 0 6px}
.hero img{width:170px;height:auto;filter:drop-shadow(0 8px 22px rgba(0,0,0,.55));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.brand{font-family:Georgia,serif;color:var(--gold);letter-spacing:.28em;text-transform:uppercase;font-size:1.05rem;margin-top:10px}
.rule{height:1px;width:140px;margin:16px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
h1{font-family:Georgia,serif;font-weight:700;font-size:clamp(1.9rem,6.5vw,2.8rem);line-height:1.15;color:#fff}
.sub{color:#B9C5E0;margin:12px auto 0;max-width:460px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:24px 0}
.chip{border:1px solid rgba(214,177,88,.5);background:rgba(255,255,255,.04);border-radius:14px;padding:10px 18px;text-align:center;min-width:110px}
.chip b{display:block;font-family:Georgia,serif;font-size:1.7rem;color:var(--gold)}
.chip span{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:#B9C5E0}
.btn{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:15px 30px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:1rem;color:#1a1405;background:linear-gradient(180deg,#e8c773,var(--gold2));box-shadow:0 6px 18px rgba(214,177,88,.28);transition:transform .15s,box-shadow .15s;min-height:52px}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(214,177,88,.38)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);box-shadow:none}
.center{text-align:center}
.top{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid rgba(214,177,88,.5)}
.top img{width:42px;height:auto}
.top .t{font-family:Georgia,serif;color:var(--gold);letter-spacing:.2em;text-transform:uppercase;font-size:.95rem;line-height:1.2}
.top .r{margin-left:auto;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:#B9C5E0;text-align:right}
.bar{height:5px;background:rgba(255,255,255,.1);border-radius:9px;margin:12px 0 18px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),#f0d58b);transition:width .5s ease}
.meta{display:flex;justify-content:space-between;font-size:.9rem;color:#B9C5E0;margin-bottom:10px;gap:8px}
.meta b{color:var(--gold)}
.card{background:var(--parch);color:var(--ink);border-radius:18px;padding:24px 22px;box-shadow:0 14px 40px rgba(0,0,0,.5),inset 0 0 0 2px rgba(214,177,88,.7);position:relative}
.tag{display:inline-block;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:#7a5d17;border:1px solid #b8923a;border-radius:99px;padding:2px 10px;margin-bottom:10px}
.q{font-family:Georgia,serif;font-size:clamp(1.15rem,4.2vw,1.45rem);line-height:1.4;margin-bottom:18px}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:center;width:100%;min-height:56px;padding:12px 14px;border-radius:12px;border:2px solid #cdbf98;background:#fffaf0;color:var(--ink);transition:transform .12s,border-color .15s,background .15s,opacity .2s}
.opt:hover:not(:disabled){border-color:var(--gold2);transform:translateX(4px);background:#fff}
.opt .b{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--ink);color:var(--gold);font-family:Georgia,serif}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .4s}
.opt.ok .b{background:#fff;color:var(--ok)}
.opt.no{background:var(--bad);border-color:var(--bad);color:#fff;animation:shake .4s}
.opt.no .b{background:#fff;color:var(--bad)}
.opt.dim{opacity:.45}
@keyframes pop{50%{transform:scale(1.025)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{display:none;margin-top:16px;padding:14px 16px;border-radius:12px;border-left:5px solid;background:rgba(6,14,36,.06)}
.fb.show{display:block;animation:fade .35s}
.fb.good{border-color:var(--ok)}.fb.bad{border-color:var(--bad)}
.fb h3{font-family:Georgia,serif;font-size:1.1rem;margin-bottom:4px}
.fb.good h3{color:var(--ok)}.fb.bad h3{color:var(--bad)}
.fb p{font-size:.95rem}
.nextrow{display:none;justify-content:flex-end;margin-top:16px}.nextrow.show{display:flex}
.score{font-family:Georgia,serif;font-size:clamp(3.6rem,18vw,6rem);color:var(--gold);line-height:1}
.msg{font-family:Georgia,serif;font-size:1.3rem;margin:8px 0 4px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.rev{margin-top:30px;display:grid;gap:10px}
.ri{background:rgba(255,255,255,.05);border:1px solid rgba(214,177,88,.35);border-left:5px solid;border-radius:12px;padding:12px 14px;font-size:.93rem}
.ri.g{border-left-color:var(--blue)}.ri.w{border-left-color:var(--bad)}
.ri .k{color:var(--gold);font-weight:700;margin-right:6px}
.ri small{display:block;color:#B9C5E0;margin-top:4px}
footer{text-align:center;color:#8794b5;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;margin-top:34px}
.conf{position:fixed;top:-12px;width:9px;height:14px;z-index:9;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
@media(max-width:520px){.card{padding:20px 16px}.top .t{font-size:.8rem}.top .r{font-size:.6rem}}
</style>
</head>

<script>
(function(){
var TF=[["Money is anything generally accepted as payment for goods and services or for the repayment of debts.", true, "Generally accepted means of payment and of debt repayment is what defines money."], ["All forms of money must exist physically as paper bills or coins.", false, "Money also includes checking account deposits and cheques."], ["Both money and wealth are stock variables, while income is a flow variable.", true, "Money and wealth are measured at a point in time (stocks), while income is measured over a period (a flow)."], ["The medium-of-exchange function of money increases transaction costs by requiring a double coincidence of wants.", false, "Money eliminates the need for a double coincidence of wants and reduces transaction costs."], ["For a commodity to function effectively as money, it should be widely accepted, divisible, portable, standardized, and durable.", true, "These are the desirable characteristics of a commodity used as money."], ["Money serves as a unit of account by providing a common measure for expressing the value of goods and services.", true, "Expressing all values in one common measure is the unit-of-account function."], ["Money is considered the most liquid asset because it must first be converted into another asset before making purchases.", false, "Money can be used directly to make purchases without conversion."], ["If the general price level doubles, the purchasing power of money falls by half.", true, "With prices twice as high, each unit of money buys only half as much."], ["Commodity money has little intrinsic value and derives its acceptance entirely from government decrees.", false, "Commodity money consists of valuable commodities, such as gold and silver."], ["Fiat money maintains its value partly because people trust the issuing authority and expect its production to be limited.", true, "Trust in the issuer and limited production help fiat money hold its value."], ["Cheques improve payment efficiency by allowing large transactions without physically transporting substantial amounts of currency.", true, "Cheques let large payments be made without moving large amounts of currency."], ["One disadvantage of cheques is that processing them may require several business days and involve significant paperwork costs.", true, "Time and paperwork costs are a major drawback of cheques."], ["Debit cards transfer money electronically from the customer's bank account directly to the merchant's account.", true, "A debit card payment moves funds electronically from the customer's account to the merchant's."], ["A smart card cannot be reloaded with digital cash once its original prepaid balance has been exhausted.", false, "Smart cards contain computer chips that allow them to be reloaded with digital cash."], ["Cryptocurrencies are generally regarded as stable units of account because their prices rarely fluctuate.", false, "Their extreme price volatility makes them unsuitable as stable units of account or reliable stores of value."]];
var MC=[["Which of the following best defines money?", ["All assets owned by an individual", "Anything generally accepted for payments and debt repayment", "Only government-issued paper currency", "Earnings received during a specific period"], 1, "Money is anything generally accepted as payment for goods and services and for repaying debts."], ["Which of the following is classified as a flow variable?", ["Wealth", "Money supply", "Monthly salary", "Real estate holdings"], 2, "Income, such as a monthly salary, is measured over a period, so it is a flow variable; wealth and money are stocks."], ["Which function of money eliminates the need for a double coincidence of wants?", ["Store of value", "Unit of account", "Medium of exchange", "Measure of wealth"], 2, "As a medium of exchange, money removes the need for a double coincidence of wants and lowers transaction costs."], ["In a barter economy, transaction costs are generally high because:", ["Money loses its value rapidly.", "Buyers and sellers must find matching wants.", "Goods have standardized prices.", "Banks charge high transaction fees."], 1, "Barter requires a double coincidence of wants, which makes finding a trade costly."], ["Which of the following is NOT a desirable characteristic of commodity money?", ["Durability", "Divisibility", "Difficulty of transportation", "Wide acceptance"], 2, "Commodity money should be portable; difficulty of transportation is a drawback, not a desirable trait."], ["The unit-of-account function of money reduces transaction costs primarily by:", ["Increasing the number of prices that must be compared.", "Eliminating the need to save money.", "Providing a common measure of value.", "Preventing all changes in prices."], 2, "A common measure of value lets the worth of goods and services be expressed and compared simply."], ["Why might individuals prefer holding money even when other assets offer higher returns?", ["Money always increases in value.", "Money is the most liquid asset.", "Money is unaffected by inflation.", "Money pays the highest interest rate."], 1, "Money can be used directly for purchases without conversion, which makes it the most liquid asset."], ["If the prices of all goods double while the amount of money held remains unchanged, what happens to the purchasing power of that money?", ["It doubles.", "It remains unchanged.", "It falls by 25%.", "It falls by 50%."], 3, "When the price level doubles, purchasing power falls by half."], ["Which of the following is an example of commodity money?", ["A debit card", "A bank cheque", "Gold used as a medium of exchange", "An electronic bank transfer"], 2, "Commodity money consists of valuable commodities, such as gold and silver."], ["Which statement best describes fiat money?", ["Money whose value depends entirely on its metal content", "Money declared legal tender by the government", "Money used exclusively for international trade", "Money that can only be exchanged for gold"], 1, "Fiat money is declared legal tender by the government and holds value through trust in the issuer and limited production."], ["Which advantage of cheques allows payments that offset one another to be settled without transferring physical currency?", ["Inflation protection", "Currency conversion", "Clearing", "Commodity exchange"], 2, "Through clearing, offsetting cheque payments are settled without moving physical currency."], ["What is a major disadvantage of using cheques?", ["They cannot be used for large payments.", "They always require physical cash to accompany them.", "Their processing involves time and paperwork costs.", "They cannot transfer funds between bank accounts."], 2, "Processing cheques may take several business days and involve significant paperwork costs."], ["What distinguishes a smart card from a simple prepaid stored-value card?", ["It can only be used for cash withdrawals.", "It contains a computer chip allowing it to be reloaded with digital cash.", "It requires every transaction to be completed using paper cheques.", "It cannot store monetary value."], 1, "The computer chip in a smart card allows it to be reloaded with digital cash."], ["Which combination best explains why a fully cashless society has not yet emerged?", ["Low infrastructure costs and universal digital literacy", "Complete anonymity of electronic payments and zero operational risks", "High technology costs, cybersecurity risks, and financial exclusion", "The inability of electronic payments to transfer funds"], 2, "High technology costs, cybersecurity risks, and financial exclusion hold back a fully cashless society."], ["Which statement correctly distinguishes cryptocurrencies from Central Bank Digital Currencies (CBDCs)?", ["Both are necessarily issued by private commercial banks.", "Cryptocurrencies are decentralized, while CBDCs are official digital currencies developed or issued by sovereign central banks.", "Cryptocurrencies are always stable, while CBDCs have no legal backing.", "Both require physical gold to support every transaction."], 1, "Cryptocurrencies are decentralized, whereas CBDCs are official digital currencies of sovereign central banks."]];
var ALL=[];
TF.forEach(function(t){ALL.push({type:"tf",q:t[0],a:t[1],e:t[2]});});
MC.forEach(function(m){ALL.push({type:"mc",q:m[0],o:m[1],c:m[2],e:m[3]});});
var TOTAL=ALL.length;
var $=function(i){return document.getElementById(i)};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function show(id){["start","play","end"].forEach(function(s){$(s).classList.toggle("on",s===id)});window.scrollTo(0,0)}
$("nTot").textContent=TOTAL;$("nTF").textContent=TF.length;$("nMC").textContent=MC.length;
var order,idx,score,locked,log,cur;
function start(){
  order=shuffle(ALL);idx=0;score=0;log=[];
  $("sc").textContent=0;show("play");render();
}
function render(){
  locked=false;var q=order[idx];
  $("qn").textContent="Question "+(idx+1)+" of "+TOTAL;
  $("pb").style.width=(idx/TOTAL*100)+"%";
  $("tag").textContent=q.type==="tf"?"True or False":"Multiple Choice";
  $("qt").textContent=q.q;
  $("fb").className="fb";$("nr").className="nextrow";
  $("nx").textContent=idx===TOTAL-1?"See result":"Next question";
  var box=$("opts");box.innerHTML="";
  var opts;
  if(q.type==="tf"){opts=[{t:"True",ok:q.a===true,v:true},{t:"False",ok:q.a===false,v:false}]}
  else{opts=shuffle(q.o.map(function(t,i){return{t:t,ok:i===q.c}}))}
  cur={q:q,opts:opts};
  opts.forEach(function(o,i){
    var b=document.createElement("button");b.type="button";b.className="opt";
    var s=document.createElement("span");s.className="b";s.textContent=String.fromCharCode(65+i);
    var t=document.createElement("span");t.textContent=o.t;
    b.appendChild(s);b.appendChild(t);
    b.addEventListener("click",function(){pick(i)});
    box.appendChild(b);
  });
}
function pick(i){
  if(locked)return;locked=true;
  var o=cur.opts,btns=$("opts").children,right=o[i].ok;
  for(var k=0;k<btns.length;k++){
    btns[k].disabled=true;
    if(o[k].ok)btns[k].classList.add("ok");
    else if(k===i)btns[k].classList.add("no");
    else btns[k].classList.add("dim");
  }
  if(right){score++;$("sc").textContent=score;burst(btns[i])}
  var good=o.filter(function(x){return x.ok})[0].t;
  log.push({q:cur.q.q,mine:o[i].t,right:good,ok:right});
  var fb=$("fb");fb.className="fb show "+(right?"good":"bad");
  $("fh").textContent=right?"Correct!":"Not quite.";
  $("fp").textContent=(right?"":"Correct answer: "+good+". ")+cur.q.e;
  $("nr").className="nextrow show";
  $("pb").style.width=((idx+1)/TOTAL*100)+"%";
}
function burst(el){
  var r=el.getBoundingClientRect(),cs=["#D6B158","#2454BE","#F6EEDB"];
  for(var n=0;n<18;n++){var d=document.createElement("i");d.className="conf";
    d.style.left=(r.left+Math.random()*r.width)+"px";d.style.top=(r.top)+"px";
    d.style.background=cs[n%3];d.style.animationDuration=(1+Math.random()*1.2)+"s";
    d.style.transform="translateY(0)";document.body.appendChild(d);
    (function(x){setTimeout(function(){x.remove()},2400)})(d)}
}
function next(){
  if(!locked)return;
  if(idx<TOTAL-1){idx++;render()}else finish();
}
function finish(){
  var pct=Math.round(score/TOTAL*100);
  $("fs").textContent=score+" / "+TOTAL;
  $("fm").textContent=pct>=90?"Outstanding!":pct>=70?"Well done!":pct>=50?"Good effort!":"Keep practicing!";
  $("fpct").textContent=pct+"% correct";
  var rv=$("rev");rv.innerHTML="";
  log.forEach(function(l,i){
    var d=document.createElement("div");d.className="ri "+(l.ok?"g":"w");
    var k=document.createElement("span");k.className="k";k.textContent=(i+1)+".";
    d.appendChild(k);d.appendChild(document.createTextNode(l.q));
    var s=document.createElement("small");
    s.textContent=l.ok?"Your answer: "+l.mine:"Your answer: "+l.mine+"  |  Correct: "+l.right;
    d.appendChild(s);rv.appendChild(d);
  });
  show("end");
  if(pct>=70)for(var n=0;n<5;n++)setTimeout(function(){burst($("fs"))},n*250);
}
$("goBtn").addEventListener("click",start);
$("rs").addEventListener("click",start);
$("nx").addEventListener("click",next);
document.addEventListener("keydown",function(e){
  if(!$("play").classList.contains("on"))return;
  if(e.key==="Enter"){next();return}
  var k=e.key.toLowerCase();
  if(!locked){
    if(k==="t"&&cur.q.type==="tf")pick(0);
    else if(k==="f"&&cur.q.type==="tf")pick(1);
    else{var n=k.charCodeAt(0)-97;if(k.length===1&&n>=0&&n<cur.opts.length)pick(n)}
  }
});
})();
</script>
