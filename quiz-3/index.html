<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money &amp; Banking Quiz 3 | Center JUST</title>
<style>
:root{--navy:#0b1426;--navy2:#13213d;--gold:#c9a24b;--gold2:#e6c878;--card:#f5ecd7;--ink:#1c2233;--blue:#1d4ed8;--red:#c62828}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Georgia,"Times New Roman",serif;color:#f1e8d0;background:radial-gradient(circle at 50% 0,#1a2c52 0,var(--navy) 60%) fixed;display:flex;justify-content:center;padding:18px}
.wrap{width:100%;max-width:760px}
.brand{text-align:center;margin-bottom:14px}
.brand img{width:110px;height:110px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 24px rgba(201,162,75,.35);background:#000}
.brand .name{margin-top:8px;font-size:1.3rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2);font-weight:bold}
.panel{background:var(--card);color:var(--ink);border:2px solid var(--gold);border-radius:16px;padding:26px;box-shadow:0 12px 34px rgba(0,0,0,.5),inset 0 0 0 5px rgba(201,162,75,.18);animation:rise .45s ease}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{margin:0 0 8px;font-size:1.8rem;text-align:center;color:var(--navy2)}
.sub{text-align:center;font-style:italic;margin:0 0 18px;color:#4a4f63}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.chip{background:var(--navy2);color:var(--gold2);border-radius:999px;padding:6px 14px;font-size:.9rem;border:1px solid var(--gold)}
.btn{display:block;width:100%;font:inherit;font-size:1.1rem;font-weight:bold;padding:15px;border-radius:12px;border:2px solid var(--gold);background:linear-gradient(180deg,#1b2f5a,var(--navy2));color:var(--gold2);cursor:pointer;transition:.2s;letter-spacing:.04em}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(11,20,38,.4);background:linear-gradient(180deg,#24407a,#1b2f5a)}
.hidden{display:none!important}
.top{display:flex;justify-content:space-between;font-size:.95rem;margin-bottom:8px;color:#4a4f63;font-weight:bold}
.bar{height:8px;background:#d9cba8;border-radius:6px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .4s}
.tag{display:inline-block;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);background:var(--navy2);padding:3px 10px;border-radius:6px;margin-bottom:10px}
.q{font-size:1.25rem;line-height:1.45;margin:0 0 18px;font-weight:bold}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;font-size:1.05rem;padding:14px;margin-bottom:10px;min-height:54px;border-radius:12px;border:2px solid #c9b98c;background:#fffaf0;color:var(--ink);cursor:pointer;transition:.18s}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateX(4px);background:#fff3d6}
.opt b{flex:none;width:32px;height:32px;border-radius:50%;background:var(--navy2);color:var(--gold2);display:grid;place-items:center;font-size:.95rem}
.opt:disabled{cursor:default}
.opt.correct{background:var(--blue);border-color:#0f2f99;color:#fff}
.opt.wrong{background:var(--red);border-color:#8e1b1b;color:#fff;animation:shake .4s}
.opt.dim{opacity:.55}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:14px;padding:14px;border-radius:12px;border-left:6px solid;animation:rise .3s}
.fb.ok{background:#dbe6ff;border-color:var(--blue)}
.fb.no{background:#fde0de;border-color:var(--red)}
.fb strong{display:block;margin-bottom:4px}
#next{margin-top:16px}
.big{font-size:3.2rem;text-align:center;margin:8px 0;color:var(--navy2);font-weight:bold}
.msg{text-align:center;margin-bottom:20px;font-size:1.1rem}
@media(max-width:480px){.panel{padding:18px}h1{font-size:1.45rem}.q{font-size:1.1rem}.brand img{width:90px;height:90px}}
</style>
</head>

 ["Which of the following is an example of a lender-saver?",["A household saving part of its income","A company borrowing to build a factory","A household taking a car loan","A government running a budget deficit"],0,"Households with surplus funds may save or invest them."],

 ["What is the main difference between debt instruments and equity instruments?",["Debt instruments always have no maturity date","Equity instruments represent ownership in a company","Debt instruments give holders voting rights in every company","Equity instruments always pay fixed interest"],1,"Common stocks represent ownership, whereas bonds represent debt."],
 ["What does the maturity of a debt instrument refer to?",["The number of shareholders in a firm","The annual dividend rate","The number of years until the instrument expires","The market value of a company's assets"],2,"Maturity is the period until the debt instrument's expiration date."],

 ["Why are equity holders described as residual claimants?",["They receive fixed interest payments before creditors","They have no claim on company assets","They are paid after debt holders and other creditors","They are guaranteed dividends every year"],2,"Equity holders receive what remains after the company's obligations to creditors are met."],
 ["What is a primary market?",["A market for foreign currencies only","A market where previously issued securities are resold","A market where newly issued securities are sold to initial buyers","A market where banks accept deposits only"],2,"The issuer receives funds when new securities are sold in the primary market."],
 ["What happens when an investor buys a previously issued security in the secondary market?",["The original issuer always receives new funds","The seller receives the money, while the original issuer receives no new funds from the transaction","The security becomes a new issue","The investor automatically becomes a creditor of a bank"],1,"Secondary-market transactions occur between investors rather than raising new funds for the original issuer."],
 ["Which of the following is a major function of the secondary market?",["Providing liquidity for securities","Guaranteeing company profits","Eliminating all price fluctuations","Ensuring that all shareholders receive fixed dividends"],0,"The secondary market makes securities easier to buy and sell."],

var QUESTIONS = [];
TF.forEach(function(t){QUESTIONS.push({type:"True / False",q:t[0],opts:["True","False"],ans:t[1]?0:1,exp:t[2],bool:t[1]});});
MC.forEach(function(m){QUESTIONS.push({type:"Multiple Choice",q:m[0],opts:m[1],ans:m[2],exp:m[3]});});

var $=function(id){return document.getElementById(id)};
var deck=[],i=0,score=0,answered=false;
var LET="ABCD";

document.title=QUIZ_TITLE+" | Center JUST";
$("title").textContent=QUIZ_TITLE;
$("chips").innerHTML='<span class="chip">'+QUESTIONS.length+' Questions</span><span class="chip">'+TF.length+' True / False</span><span class="chip">'+MC.length+' Multiple Choice</span>';

function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t;}return a;}
function show(id){["intro","game","end"].forEach(function(s){$(s).classList.toggle("hidden",s!==id);});}

function begin(){deck=shuffle(QUESTIONS);i=0;score=0;show("game");render();}

function render(){
  var q=deck[i];answered=false;
  $("prog").textContent="Question "+(i+1)+" of "+deck.length;
  $("score").textContent="Correct: "+score;
  $("fill").style.width=(i/deck.length*100)+"%";
  $("tag").textContent=q.type;
  $("q").textContent=q.q;
  $("fb").classList.add("hidden");$("next").classList.add("hidden");
  var box=$("opts");box.innerHTML="";
  q.opts.forEach(function(o,k){
    var b=document.createElement("button");b.className="opt";
    b.innerHTML="<b>"+(q.opts.length===2?(k===0?"T":"F"):LET[k])+"</b><span></span>";
    b.lastChild.textContent=o;
    b.onclick=function(){pick(k)};
    box.appendChild(b);
  });
}

function pick(k){
  if(answered)return;answered=true;
  var q=deck[i],ok=(k===q.ans);
  if(ok)score++;
  var bs=$("opts").children;
  for(var n=0;n<bs.length;n++){
    bs[n].disabled=true;
    if(n===q.ans)bs[n].classList.add("correct");
    else if(n===k)bs[n].classList.add("wrong");
    else bs[n].classList.add("dim");
  }
  var fb=$("fb");fb.className="fb "+(ok?"ok":"no");
  fb.innerHTML="<strong>"+(ok?"Correct!":"Incorrect.")+"</strong>";
  var p=document.createElement("span");p.textContent=q.exp;fb.appendChild(p);
  $("score").textContent="Correct: "+score;
  $("fill").style.width=((i+1)/deck.length*100)+"%";
  $("next").textContent=(i===deck.length-1)?"See results":"Next question";
  $("next").classList.remove("hidden");
}

function next(){
  i++;
  if(i>=deck.length){finish();}else{render();}
}

function finish(){
  show("end");
  $("final").textContent=score+" / "+deck.length;
  var r=score/deck.length;
  $("msg").textContent=r>=.9?"Outstanding! Excellent mastery of the material.":r>=.7?"Well done! You have a strong understanding.":r>=.5?"Good effort. A little more review will help.":"Keep studying and try again. You can do it!";
}

$("start").onclick=begin;
$("next").onclick=next;
$("restart").onclick=begin;
</script>
