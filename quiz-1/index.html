<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money & Banking Quiz 1 | Center JUST</title>
<style>
  :root{
    --navy:#0d1b2a;
    --navy-2:#132a3e;
    --parchment:#f5efdf;
    --parchment-2:#ece2c6;
    --gold:#c9a227;
    --gold-dark:#a3801c;
    --blue:#1d6fa5;
    --red:#b23a3a;
    --ink:#22303f;
    font-family: 'Georgia', 'Times New Roman', serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(circle at top, var(--navy-2), var(--navy) 70%);
    color: var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px 12px;
  }
  .app{
    width:100%;
    max-width:640px;
  }
  .brand{
    text-align:center;
    color: var(--parchment);
    margin-bottom: 16px;
  }
  .brand img.logo{
    width:78px;
    height:78px;
    border-radius:50%;
    display:block;
    margin: 0 auto 10px;
    box-shadow: 0 0 0 3px var(--gold), 0 6px 18px rgba(0,0,0,0.5);
  }
  .brand .badge{
    display:inline-block;
    padding:6px 18px;
    border:2px solid var(--gold);
    border-radius: 999px;
    font-size: 0.85rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
  }
  .brand h1{
    margin: 4px 0 0;
    font-size: 1.5rem;
  }
  .card{
    background: linear-gradient(180deg, var(--parchment) 0%, var(--parchment-2) 100%);
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    border: 3px solid var(--gold-dark);
    padding: 28px 24px;
    position: relative;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:6px;
    border:1px solid rgba(163,128,28,0.4);
    border-radius: 12px;
    pointer-events:none;
  }
  .intro-logo{
    width:110px;
    height:110px;
    border-radius:50%;
    display:block;
    margin: 0 auto 16px;
    box-shadow: 0 0 0 3px var(--gold-dark);
  }
  h2{
    margin-top:0;
    color: var(--navy);
    text-align:center;
  }
  p.sub{
    color:#4a4a3f;
    line-height:1.5;
    text-align:center;
  }
  .stats{
    display:flex;
    justify-content:center;
    gap:12px;
    margin: 16px 0;
    font-size:0.9rem;
    color:#5b5240;
    flex-wrap:wrap;
  }
  .stats span{
    background: rgba(201,162,39,0.18);
    border: 1px solid var(--gold-dark);
    border-radius: 8px;
    padding: 6px 12px;
  }
  .start-row{
    text-align:center;
  }
  button.primary{
    background: linear-gradient(180deg, var(--gold), var(--gold-dark));
    color: var(--navy);
    border: none;
    font-weight: bold;
    font-size: 1.05rem;
    padding: 14px 28px;
    border-radius: 10px;
    cursor:pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.25);
    transition: transform .08s ease;
    min-height: 48px;
  }
  button.primary:active{ transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.25);}
  .progress-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 14px;
    font-size:0.9rem;
    color:#5b5240;
    font-weight:bold;
  }
  .progress-bar{
    background: rgba(0,0,0,0.12);
    border-radius: 999px;
    height:8px;
    overflow:hidden;
    margin-bottom: 20px;
  }
  .progress-fill{
    background: linear-gradient(90deg, var(--gold-dark), var(--gold));
    height:100%;
    transition: width .3s ease;
  }
  .qtype{
    display:inline-block;
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:1px;
    background: var(--navy);
    color: var(--parchment);
    padding:3px 10px;
    border-radius:999px;
    margin-bottom:10px;
  }
  .question-text{
    font-size:1.15rem;
    line-height:1.5;
    margin-bottom:20px;
    color: var(--navy);
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .opt{
    text-align:left;
    background:#fffdf6;
    border:2px solid #cbb98a;
    border-radius:12px;
    padding:14px 16px;
    font-size:1rem;
    cursor:pointer;
    min-height:48px;
    color: var(--ink);
    transition: background .15s ease, border-color .15s ease;
    font-family: inherit;
  }
  .opt:hover:not(:disabled){
    border-color: var(--gold-dark);
    background:#fffaf0;
  }
  .opt:disabled{ cursor:default; }
  .opt.correct{
    background: rgba(29,111,165,0.15);
    border-color: var(--blue);
    color: var(--blue);
    font-weight:bold;
  }
  .opt.incorrect{
    background: rgba(178,58,58,0.15);
    border-color: var(--red);
    color: var(--red);
    font-weight:bold;
  }
  .feedback{
    margin-top:18px;
    padding:14px 16px;
    border-radius:10px;
    font-size:0.95rem;
    line-height:1.5;
  }
  .feedback.correct{ background: rgba(29,111,165,0.12); border:1px solid var(--blue); color:#0d3a56;}
  .feedback.incorrect{ background: rgba(178,58,58,0.12); border:1px solid var(--red); color:#5c1c1c;}
  .feedback .verdict{ font-weight:bold; display:block; margin-bottom:4px; }
  .next-row{
    display:flex;
    justify-content:flex-end;
    margin-top:20px;
  }
  .hidden{ display:none !important; }
  .score-display{
    text-align:center;
  }
  .score-display .big{
    font-size:2.4rem;
    font-weight:bold;
    color: var(--navy);
    margin: 10px 0;
  }
  .score-display .gold-text{ color: var(--gold-dark); }
  footer.foot{
    text-align:center;
    color: rgba(245,239,223,0.55);
    font-size:0.75rem;
    margin-top:18px;
  }
  @media (max-width:480px){
    .card{ padding:20px 16px; }
    .question-text{ font-size:1.05rem; }
  }
</style>
</head>

        <p class="sub">Here's how you did:</p>
        <div class="big"><span id="finalScore"></span> / <span id="finalTotal" class="gold-text"></span></div>

  <footer class="foot">Center JUST — Money &amp; Banking Quiz 1</footer>
</div>

<script>
(function(){

  // ---------- QUESTION BANK ----------
  const questions = [
    {
      type:"mcq",
      q:"What are the two kinds of assets that people and firms buy and sell in financial markets?",
      options:["Currencies and Securities","Stocks and Real estate","Gold and Currencies","Bonds and Real estate"],
      correct:0,
      explanation:"Currencies and securities."
    },
    {
      type:"tf",
      q:"A financial market transfers funds from people who have an excess of available funds to people who have a shortage of funds.",
      correct:true,
      explanation:"True — that is exactly what a financial market does."
    },
    {
      type:"mcq",
      q:"Which group is NOT one of the Lender-Savers or Borrower-Spenders?",
      options:["Households","Business firms","Financial regulators","Foreigners"],
      correct:2,
      explanation:"Financial regulators."
    },
    {
      type:"mcq",
      q:"Which of the following is NOT a reason financial markets are important?",
      options:["Promoting economic efficiency","Producing high economic growth","Effects on personal wealth","Guaranteeing zero investment risk"],
      correct:3,
      explanation:"Guaranteeing zero investment risk."
    },
    {
      type:"tf",
      q:"Well-functioning financial markets are a key factor in producing high economic growth.",
      correct:true,
      explanation:"True."
    },
    {
      type:"mcq",
      q:"How is a security best defined?",
      options:["A claim on the issuer's future income or assets","A physical asset like gold","A type of currency","A government tax"],
      correct:0,
      explanation:"A claim on the issuer's future income or assets."
    },
    {
      type:"tf",
      q:"Securities include both stocks (equities) and bonds (debentures).",
      correct:true,
      explanation:"True."
    },
    {
      type:"mcq",
      q:"Besides issuing securities, what other method can be used to raise funds?",
      options:["Printing new currency","Obtaining loans from banks","Selling government land","Increasing taxes"],
      correct:1,
      explanation:"Obtaining loans from banks."
    },
    {
      type:"mcq",
      q:"How is a bond best described?",
      options:["A debt security that promises periodic payments for a specified period of time","A share of ownership in a company","A currency traded internationally","A short-term government tax"],
      correct:0,
      explanation:"A debt security that promises periodic payments for a specified period of time."
    },
    {
      type:"tf",
      q:"The bond market is important partly because it is the place where interest rates are determined.",
      correct:true,
      explanation:"True."
    },
    {
      type:"mcq",
      q:"How is an interest rate defined?",
      options:["The cost of borrowing or the price paid for the rental of funds","The profit margin earned by a bank","The tax rate on personal income","The exchange rate between two currencies"],
      correct:0,
      explanation:"The cost of borrowing or the price paid for the rental of funds."
    },
    {
      type:"mcq",
      q:"Which of these is an example of a type of interest rate?",
      options:["Mortgage interest rate","Sales tax rate","Corporate income tax rate","Import tariff rate"],
      correct:0,
      explanation:"Mortgage interest rate."
    },
    {
      type:"tf",
      q:"On a personal level, high interest rates could encourage saving because more interest income can be earned.",
      correct:true,
      explanation:"True."
    },
    {
      type:"mcq",
      q:"On a more general level, interest rates affect:",
      options:["Only consumers' spending, not business decisions","Only business investment, not consumer behavior","Both consumers' willingness to spend or save and businesses' investment decisions","Neither consumers nor businesses"],
      correct:2,
      explanation:"Both consumers' willingness to spend or save and businesses' investment decisions."
    },
    {
      type:"mcq",
      q:"What does a common stock represent?",
      options:["A share of ownership in a corporation","A loan made to a corporation","A type of government bond","A form of foreign currency"],
      correct:0,
      explanation:"A share of ownership in a corporation."
    },
    {
      type:"tf",
      q:"Stocks have a maturity date, just like bonds do.",
      correct:false,
      explanation:"False — stocks have no maturity date, while bonds do."
    },
    {
      type:"mcq",
      q:"Compared with bondholders, shareholders occupy a position that is:",
      options:["Financially safer","Financially riskier, since they are the residual claimants","Exactly the same in risk","Not affected by company performance"],
      correct:1,
      explanation:"Financially riskier, since they are the residual claimants."
    },
    {
      type:"tf",
      q:"A bondholder is a creditor to the company, not an owner.",
      correct:true,
      explanation:"True."
    },
    {
      type:"mcq",
      q:"Which of the following is a right of a shareholder?",
      options:["The right to get the face value of a bond at maturity","The right to vote at the general assembly of shareholders","The right to be paid before shareholders in liquidation","The right to a fixed periodic interest payment"],
      correct:1,
      explanation:"The right to vote at the general assembly of shareholders."
    },
    {
      type:"mcq",
      q:"Which of the following is a right of a bondholder?",
      options:["The right to participate in company management","The right to vote in the general assembly","The right to obtain their debts before shareholders in case of liquidation","The right to share in residual assets after liquidation"],
      correct:2,
      explanation:"The right to obtain their debts before shareholders in case of liquidation."
    },
    {
      type:"tf",
      q:"In case of liquidation, bondholders are paid from company assets before shareholders.",
      correct:true,
      explanation:"True."
    },
    {
      type:"mcq",
      q:"The importance of the stock market can be seen through:",
      options:["Determining interest rates","Enabling companies to borrow from banks","Trade, speculation, and price volatility affecting wealth and spending power","Guaranteeing a fixed interest payment"],
      correct:2,
      explanation:"Trade, speculation, and price volatility affecting wealth and spending power."
    },
    {
      type:"mcq",
      q:"The importance of the bond market can be seen through:",
      options:["Speculation and volatility of stock prices","Enabling companies and governments to borrow and determining interest rates","Voting rights for shareholders","Distribution of dividends"],
      correct:1,
      explanation:"Enabling companies and governments to borrow and determining interest rates."
    },
    {
      type:"tf",
      q:"A shareholder's right to a share of company profits is referred to as dividends.",
      correct:true,
      explanation:"True."
    },
    {
      type:"mcq",
      q:"In economics, what does a market consist of?",
      options:["People and firms who buy and sell something","Only government agencies","Only banks","A single global institution"],
      correct:0,
      explanation:"People and firms who buy and sell something."
    },
    {
      type:"tf",
      q:"High interest rates could deter someone from buying a house or a car because financing costs would be high.",
      correct:true,
      explanation:"True."
    },
    {
      type:"mcq",
      q:"Interest rates are described as important on which two levels?",
      options:["Personal level and general level","National level and international level","Short-term level and long-term level","Corporate level and government level"],
      correct:0,
      explanation:"Personal level and general level."
    },
    {
      type:"mcq",
      q:"A bond is described as one of which type of instrument used to raise funds?",
      options:["Transferable securities' instruments","Non-transferable government instruments","Insurance instruments","Currency exchange instruments"],
      correct:0,
      explanation:"Transferable securities' instruments."
    },
    {
      type:"mcq",
      q:"Which of the following is a right of a bondholder regarding periodic income?",
      options:["The right to vote in the general assembly","The right to get interest","The right to participate in management","The right to residual assets after liquidation"],
      correct:1,
      explanation:"The right to get interest."
    },
    {
      type:"tf",
      q:"Stocks are documents proving participation in the ownership of a company, giving the right to claim profits and participate in the distribution of assets upon liquidation.",
      correct:true,
      explanation:"True."
    }
  ];

  const TOTAL = questions.length;
  const MCQ_COUNT = questions.filter(q=>q.type==="mcq").length;
  const TF_COUNT = questions.filter(q=>q.type==="tf").length;

  document.getElementById("statTotal").textContent = "Questions: " + TOTAL;
  document.getElementById("statMix").textContent = "MCQ: " + MCQ_COUNT + " · True/False: " + TF_COUNT;

  let order = [];
  let currentIndex = 0;
  let correctCount = 0;
  let answered = false;

  const startScreen = document.getElementById("startScreen");
  const quizScreen = document.getElementById("quizScreen");
  const resultsScreen = document.getElementById("resultsScreen");
  const startBtn = document.getElementById("startBtn");
  const restartBtn = document.getElementById("restartBtn");
  const nextBtn = document.getElementById("nextBtn");
  const progressLabel = document.getElementById("progressLabel");
  const scoreLabel = document.getElementById("scoreLabel");
  const progressFill = document.getElementById("progressFill");
  const qType = document.getElementById("qType");
  const questionText = document.getElementById("questionText");
  const optionsContainer = document.getElementById("optionsContainer");
  const feedbackBox = document.getElementById("feedbackBox");
  const verdictText = document.getElementById("verdictText");
  const explanationText = document.getElementById("explanationText");

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function startQuiz(){
    order = shuffle(questions.map((_,i)=>i));
    currentIndex = 0;
    correctCount = 0;
    startScreen.classList.add("hidden");
    resultsScreen.classList.add("hidden");
    quizScreen.classList.remove("hidden");
    renderQuestion();
  }

  function renderQuestion(){
    answered = false;
    const q = questions[order[currentIndex]];
    progressLabel.textContent = "Question " + (currentIndex+1) + " of " + TOTAL;
    scoreLabel.textContent = "Correct: " + correctCount;
    progressFill.style.width = Math.round(((currentIndex)/TOTAL)*100) + "%";
    qType.textContent = q.type === "mcq" ? "Multiple Choice" : "True / False";
    questionText.textContent = q.q;
    optionsContainer.innerHTML = "";
    feedbackBox.classList.add("hidden");
    feedbackBox.classList.remove("correct","incorrect");
    nextBtn.classList.add("hidden");

    let opts;
    if(q.type === "mcq"){
      opts = shuffle(q.options.map((text, idx)=>({text, isCorrect: idx === q.correct})));
    } else {
      opts = shuffle([
        {text:"True", isCorrect: q.correct === true},
        {text:"False", isCorrect: q.correct === false}
      ]);
    }

    opts.forEach(opt=>{
      const btn = document.createElement("button");
      btn.className = "opt";
      btn.textContent = opt.text;
      btn.addEventListener("click", ()=> handleAnswer(btn, opt, q));
      optionsContainer.appendChild(btn);
    });
  }

  function handleAnswer(button, opt, q){
    if(answered) return;
    answered = true;

    const allButtons = optionsContainer.querySelectorAll(".opt");
    allButtons.forEach(b=> b.disabled = true);

    allButtons.forEach(b=>{
      const matchesCorrect = (q.type === "mcq")
        ? (b.textContent === q.options[q.correct])
        : (b.textContent === (q.correct ? "True" : "False"));
      if(matchesCorrect){
        b.classList.add("correct");
      }
    });

    if(opt.isCorrect){
      correctCount++;
      button.classList.add("correct");
      feedbackBox.classList.add("correct");
      verdictText.textContent = "Correct!";
    } else {
      button.classList.add("incorrect");
      feedbackBox.classList.add("incorrect");
      verdictText.textContent = "Not quite.";
    }

    explanationText.textContent = q.explanation;
    feedbackBox.classList.remove("hidden");
    scoreLabel.textContent = "Correct: " + correctCount;
    nextBtn.classList.remove("hidden");
  }

  function nextQuestion(){
    currentIndex++;
    if(currentIndex >= TOTAL){
      showResults();
    } else {
      renderQuestion();
    }
  }

  function showResults(){
    quizScreen.classList.add("hidden");
    resultsScreen.classList.remove("hidden");
    progressFill.style.width = "100%";
    document.getElementById("finalScore").textContent = correctCount;
    document.getElementById("finalTotal").textContent = TOTAL;
    const pct = Math.round((correctCount/TOTAL)*100);
    let msg;
    if(pct === 100) msg = "Perfect score! Excellent grasp of the material.";
    else if(pct >= 80) msg = "Great work — you know this material well.";
    else if(pct >= 60) msg = "Good effort — review a few points and try again.";
    else msg = "Keep studying and give it another go.";
    document.getElementById("finalMessage").textContent = msg;
  }

  startBtn.addEventListener("click", startQuiz);
  restartBtn.addEventListener("click", startQuiz);
  nextBtn.addEventListener("click", nextQuestion);

})();
</script>
