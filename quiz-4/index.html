<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money &amp; Banking Quiz 4 | Center JUST</title>
<style>
:root{
  --navy-900:#070d1f;
  --navy-800:#0b1530;
  --navy-700:#13213f;
  --navy-600:#1d2f57;
  --parchment:#f4ead2;
  --parchment-2:#ebdfc0;
  --ink:#14203d;
  --gold:#c9a24a;
  --gold-light:#e6c777;
  --gold-dark:#8f6f25;
  --correct:#1c4fd1;
  --correct-dark:#12379a;
  --wrong:#c42b2b;
  --wrong-dark:#8f1c1c;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh;min-height:100dvh;
  font-family:var(--serif);
  color:var(--parchment);
  background:
    radial-gradient(ellipse at 50% -10%,rgba(201,162,74,.16),transparent 55%),
    radial-gradient(ellipse at 50% 120%,rgba(28,79,209,.18),transparent 60%),
    linear-gradient(180deg,var(--navy-800),var(--navy-900));
  background-attachment:fixed;
  display:flex;align-items:center;justify-content:center;
  padding:20px 14px;
}
.wrap{width:100%;max-width:720px}
.screen{display:none}
.screen.active{display:block}

/* ---------- frame ---------- */
.frame{
  position:relative;
  background:linear-gradient(180deg,var(--navy-700),var(--navy-800));
  border:2px solid var(--gold);
  border-radius:6px;
  padding:34px 26px 30px;
  box-shadow:0 0 0 6px var(--navy-900),0 0 0 7px rgba(201,162,74,.55),0 24px 60px rgba(0,0,0,.55);
  text-align:center;
}
.frame::before,.frame::after{
  content:"";position:absolute;width:26px;height:26px;border:2px solid var(--gold-light);pointer-events:none
}
.frame::before{top:8px;left:8px;border-right:0;border-bottom:0}
.frame::after{bottom:8px;right:8px;border-left:0;border-top:0}

.logo-main{
  width:190px;max-width:52vw;height:auto;display:block;margin:0 auto 8px;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.55));
  animation:logoIn 1s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes logoIn{from{opacity:0;transform:scale(.86) rotate(-6deg)}to{opacity:1;transform:none}}
.brand{
  font-size:1.9rem;font-weight:700;letter-spacing:.04em;color:var(--gold-light);
  text-shadow:0 2px 0 rgba(0,0,0,.45);
}
.rule{
  height:12px;margin:14px auto 16px;max-width:260px;position:relative;
}
.rule::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.rule::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;background:var(--gold);transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 0 4px var(--navy-700)}
h1{font-size:clamp(1.9rem,6vw,2.7rem);line-height:1.15;color:var(--parchment);font-weight:700;margin-bottom:10px}
.subtitle{font-size:1.1rem;font-style:italic;color:#cfc6ab;line-height:1.55;max-width:460px;margin:0 auto 22px}

.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:26px}
.chip{
  background:rgba(7,13,31,.55);border:1px solid rgba(201,162,74,.6);border-radius:999px;
  padding:8px 16px;font-size:.98rem;color:var(--parchment)
}
.chip b{color:var(--gold-light);font-size:1.1rem}

.btn{
  font-family:var(--serif);font-size:1.15rem;font-weight:700;letter-spacing:.03em;
  color:var(--navy-900);
  background:linear-gradient(180deg,var(--gold-light),var(--gold) 55%,var(--gold-dark));
  border:1px solid #f3dc9d;border-radius:8px;
  padding:15px 38px;min-height:54px;cursor:pointer;
  box-shadow:0 5px 0 #6e531a,0 12px 24px rgba(0,0,0,.4);
  transition:transform .12s ease,box-shadow .12s ease,filter .12s ease;
}
.btn:hover{filter:brightness(1.07);transform:translateY(-2px);box-shadow:0 7px 0 #6e531a,0 16px 28px rgba(0,0,0,.45)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #6e531a,0 6px 12px rgba(0,0,0,.4)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* ---------- quiz ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.mini-brand{display:flex;align-items:center;gap:10px;color:var(--gold-light);font-weight:700;font-size:1.05rem;letter-spacing:.03em}
.mini-brand img{width:44px;height:44px;object-fit:contain}
.score-pill{
  background:rgba(7,13,31,.6);border:1px solid var(--gold);border-radius:999px;
  padding:7px 15px;font-size:.98rem;white-space:nowrap
}
.score-pill b{color:var(--gold-light);display:inline-block}
.score-pill b.bump{animation:bump .45s ease}
@keyframes bump{40%{transform:scale(1.55);color:#fff}}

.progress-meta{display:flex;justify-content:space-between;font-size:.98rem;color:#cfc6ab;margin-bottom:7px}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(201,162,74,.5);overflow:hidden;margin-bottom:18px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-dark),var(--gold-light));border-radius:999px;transition:width .5s ease}

.card{
  background:
    radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.55),transparent 60%),
    var(--parchment);
  color:var(--ink);
  border:2px solid var(--gold);
  border-radius:8px;
  padding:24px 20px 22px;
  box-shadow:0 0 0 5px var(--navy-900),0 0 0 6px rgba(201,162,74,.5),0 20px 46px rgba(0,0,0,.55);
  text-align:left;
}
.card.enter{animation:cardIn .4s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.qtype{
  display:inline-block;font-size:.88rem;font-weight:700;color:var(--gold-dark);
  border:1px solid var(--gold-dark);border-radius:4px;padding:2px 9px;margin-bottom:12px;
}
.qtext{font-size:clamp(1.2rem,3.8vw,1.5rem);line-height:1.45;font-weight:700;margin-bottom:20px;color:var(--ink)}

.opts{display:grid;gap:12px}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{
  font-family:var(--serif);font-size:1.1rem;line-height:1.4;text-align:left;color:var(--ink);
  background:#fbf5e3;border:2px solid #cdbb8a;border-radius:8px;
  padding:14px 16px;min-height:56px;cursor:pointer;
  display:flex;align-items:center;gap:13px;
  transition:transform .12s ease,border-color .12s ease,background .12s ease,box-shadow .12s ease;
}
.opts.tf .opt{justify-content:center;text-align:center;font-weight:700;font-size:1.25rem}
.opt .letter{
  flex:0 0 auto;width:34px;height:34px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--navy-800);color:var(--gold-light);font-weight:700;font-size:1rem;
  border:1px solid var(--gold);
}
.opt:hover:not(:disabled){border-color:var(--gold-dark);background:#fff;transform:translateX(3px);box-shadow:0 4px 12px rgba(20,32,61,.18)}
.opts.tf .opt:hover:not(:disabled){transform:translateY(-3px)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--correct);border-color:var(--correct-dark);color:#fff;animation:pop .4s ease}
.opt.correct .letter{background:#fff;color:var(--correct);border-color:#fff}
.opt.wrong{background:var(--wrong);border-color:var(--wrong-dark);color:#fff;animation:shake .45s ease}
.opt.wrong .letter{background:#fff;color:var(--wrong);border-color:#fff}
.opt.reveal{background:#dde8ff;border:2px solid var(--correct);color:var(--correct-dark);font-weight:700}
.opt.dim{opacity:.55}
@keyframes pop{40%{transform:scale(1.035)}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}

.feedback{display:none;margin-top:18px;border-radius:8px;padding:15px 17px;border-left:6px solid;animation:cardIn .35s ease both}
.feedback.show{display:block}
.feedback.ok{background:#e2ebff;border-color:var(--correct);color:#0f2a75}
.feedback.no{background:#fde4e2;border-color:var(--wrong);color:#6e1414}
.feedback .verdict{font-size:1.2rem;font-weight:700;margin-bottom:5px}
.feedback .why{font-size:1.04rem;line-height:1.55}
.next-row{display:none;margin-top:18px;text-align:right}
.next-row.show{display:block}

/* ---------- results ---------- */
.ring{
  --pct:0;
  width:190px;height:190px;border-radius:50%;margin:6px auto 18px;
  background:conic-gradient(var(--gold-light) calc(var(--pct)*1%),rgba(255,255,255,.12) 0);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 30px rgba(201,162,74,.3);
}
.ring-inner{
  width:158px;height:158px;border-radius:50%;background:var(--navy-800);
  border:1px solid rgba(201,162,74,.6);
  display:flex;flex-direction:column;align-items:center;justify-content:center
}
.ring-inner b{font-size:2.6rem;color:var(--gold-light);line-height:1}
.ring-inner span{font-size:1rem;color:#cfc6ab;margin-top:4px}
.result-title{font-size:1.7rem;font-weight:700;color:var(--parchment);margin-bottom:8px}
.result-msg{font-size:1.08rem;font-style:italic;color:#cfc6ab;line-height:1.55;max-width:460px;margin:0 auto 24px}
.logo-small{width:96px;height:96px;object-fit:contain;display:block;margin:0 auto 6px}

@media (max-width:520px){
  .frame{padding:28px 16px 24px}
  .card{padding:20px 14px 18px}
  .opts.tf{grid-template-columns:1fr}
  .opt{padding:13px 13px}
  .btn{width:100%}
  .next-row{text-align:center}
  .mini-brand span{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

const QUESTIONS = [

   e:"Active trading makes Treasury bills easy to convert into cash, so they are the most liquid money market instrument."},
  {t:"tf", q:"Negotiable certificates of deposit can be resold in a secondary market.", a:true,
   e:"The word \"negotiable\" means the certificate can be sold to another investor before it matures."},
  {t:"tf", q:"Commercial paper is a long-term debt instrument issued exclusively by governments.", a:false,
   e:"Commercial paper is a short-term money market instrument. It is not a long-term debt, and it is not issued exclusively by governments."},
  {t:"tf", q:"Repurchase agreements usually have maturities of more than one year.", a:false,
   e:"Repurchase agreements are short-term money market instruments, so their maturities are not usually longer than one year."},
  {t:"tf", q:"Federal funds are overnight loans between banks involving their deposits at the Federal Reserve.", a:true,
   e:"Federal funds are overnight loans between banks of their deposits at the Federal Reserve. The interest rate on them is the federal funds rate."},

  {t:"tf", q:"A foreign bond is denominated in a currency different from the currency of the country where it is sold.", a:false,
   e:"A foreign bond is denominated in the currency of the country where it is sold. A bond in a different currency is a Eurobond."},
  {t:"tf", q:"Eurodollars are U.S. dollars deposited in banks outside the United States.", a:true,
   e:"Eurodollars are U.S. dollars held on deposit in banks located outside the United States."},

  {t:"tf", q:"Moral hazard occurs when a borrower engages in risky behavior after receiving a loan.", a:true,
   e:"Moral hazard is the risk that a borrower takes on risky activities after the loan has been granted."},

  /* ---- Multiple Choice ---- */
  {t:"mc", q:"Which of the following is considered the most liquid money market instrument?",
   o:["Commercial paper","Treasury bills","Corporate bonds","Stocks"], a:1,
   e:"Treasury bills are actively traded, which makes them the most liquid money market instrument."},
  {t:"mc", q:"How do Treasury bills effectively pay interest to their holders?",
   o:["Through monthly interest payments","Through annual dividend payments","By being sold at a discount and redeemed at a fixed amount","By paying interest every six months"], a:2,
   e:"Treasury bills are bought below face value and redeemed at the full fixed amount. The difference is the holder's interest."},
  {t:"mc", q:"Negotiable certificates of deposit are typically issued in multiples of:",
   o:["$1,000","$10,000","$50,000","$100,000"], a:3,
   e:"Negotiable certificates of deposit are typically issued in multiples of $100,000."},
  {t:"mc", q:"Which instrument uses Treasury bills as collateral for a short-term loan?",
   o:["Repurchase agreement","Commercial paper","Corporate bond","Stock"], a:0,
   e:"A repurchase agreement is a short-term loan that uses Treasury bills as collateral."},
  {t:"mc", q:"The interest rate on overnight loans between banks involving deposits at the Federal Reserve is called the:",
   o:["Discount yield","Corporate bond rate","Federal funds rate","Mortgage rate"], a:2,
   e:"The rate charged on overnight loans of deposits at the Federal Reserve is the federal funds rate."},
  {t:"mc", q:"Which statement best describes capital market instruments?",
   o:["They always mature within one month","They include debt and equity instruments with maturities greater than one year","They are always risk-free","They experience less price fluctuation than money market instruments"], a:1,
   e:"Capital market instruments are debt and equity securities with maturities longer than one year. They are not risk-free."},
  {t:"mc", q:"Why are stocks generally riskier than bonds?",
   o:["Stocks always have shorter maturities","Stockholders receive guaranteed profits","Companies cannot issue stocks to raise funds","Stock earnings depend on unpredictable company profits"], a:3,
   e:"Stock earnings depend on company profits, which cannot be predicted with certainty. That unpredictability makes stocks riskier."},
  {t:"mc", q:"What is the primary purpose of a mortgage-backed security (MBS)?",
   o:["To combine mortgages into a financial product that can be sold to investors","To provide overnight loans between banks","To replace all corporate stocks","To guarantee that homeowners never default"], a:0,
   e:"An MBS pools mortgages together into a financial product that can be sold to investors."},
  {t:"mc", q:"How often does a typical corporate bond pay interest?",
   o:["Every month","Once every year","Twice a year","Only at maturity"], a:2,
   e:"A typical corporate bond pays interest twice a year."},
  {t:"mc", q:"A bond sold in Europe and denominated in U.S. dollars is classified as a:",

   e:"A bond denominated in a currency other than that of the country where it is sold is a Eurobond."},
  {t:"mc", q:"Which of the following best defines Eurodollars?",

   e:"Eurodollars are U.S. dollars deposited in banks outside the United States."},
  {t:"mc", q:"Which function of financial intermediaries reduces the cost per transaction?",

const LETTERS = ["A","B","C","D"];
const $ = id => document.getElementById(id);

let order = [], idx = 0, score = 0, answered = false;

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo({top:0});
}

/* intro counts */

$("cntTF").textContent = QUESTIONS.filter(q => q.t === "tf").length;

function startQuiz(){
  order = shuffle(QUESTIONS);
  idx = 0; score = 0; answered = false;
  $("scoreNow").textContent = "0";
  show("screenQuiz");
  renderQuestion();
}

  box.className = "opts" + (q.t === "tf" ? " tf" : "");

  const labels = q.t === "tf" ? ["True","False"] : q.o;
  labels.forEach((label, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt";
    b.dataset.i = i;
    if (q.t === "mc"){
      const l = document.createElement("span");
      l.className = "letter";
      l.textContent = LETTERS[i];
      b.appendChild(l);
    }
    const t = document.createElement("span");
    t.textContent = label;
    b.appendChild(t);
    b.addEventListener("click", () => choose(i));
    box.appendChild(b);
  });

  $("feedback").className = "feedback";
  $("nextRow").className = "next-row";
  $("btnNext").textContent = (idx === TOTAL - 1) ? "See results" : "Next question";

  const card = $("card");
  card.classList.remove("enter");
  void card.offsetWidth;
  card.classList.add("enter");
}

/* correct index for a question: TF -> True is 0, False is 1 */
function correctIndex(q){
  return q.t === "tf" ? (q.a === true ? 0 : 1) : q.a;
}

function choose(i){
  if (answered) return;
  answered = true;
  const q = order[idx];
  const right = correctIndex(q);
  const ok = (i === right);
  const btns = $("opts").querySelectorAll(".opt");

  btns.forEach((b, k) => {
    b.disabled = true;
    if (k === i) b.classList.add(ok ? "correct" : "wrong");
    else if (k === right) b.classList.add("reveal");
    else b.classList.add("dim");
  });

  if (ok){
    score++;
    const s = $("scoreNow");
    s.textContent = score;
    s.classList.remove("bump"); void s.offsetWidth; s.classList.add("bump");
  }

  const fb = $("feedback");
  fb.className = "feedback show " + (ok ? "ok" : "no");
  $("verdict").textContent = ok ? "Correct!" : "Incorrect";
  $("why").textContent = (ok ? "" : "The correct answer is " +
      (q.t === "tf" ? (q.a ? "True" : "False") : LETTERS[right] + ". " + q.o[right]) + ". ") + q.e;

  $("nextRow").className = "next-row show";
  $("btnNext").focus({preventScroll:true});
  $("nextRow").scrollIntoView({behavior:"smooth", block:"nearest"});
}

function nextQuestion(){
  if (!answered) return;
  if (idx < TOTAL - 1){
    idx++;
    renderQuestion();
    window.scrollTo({top:0, behavior:"smooth"});
  } else {
    showResults();
  }
}

function showResults(){
  const pct = Math.round((score / TOTAL) * 100);
  $("finalScore").textContent = score + " / " + TOTAL;
  $("finalPct").textContent = pct + "%";
  let title, msg;
  if (pct === 100){ title = "Perfect score!"; msg = "Outstanding. You answered every question correctly."; }
  else if (pct >= 80){ title = "Excellent work"; msg = "You have a strong grasp of money and banking. A quick review of the missed items will make it perfect."; }
  else if (pct >= 60){ title = "Good effort"; msg = "You are on the right track. Restart the quiz to practise the questions you missed."; }
  else { title = "Keep practising"; msg = "Review the topics and try again. The questions are reshuffled every time you restart."; }
  $("endTitle").textContent = title;
  $("endMsg").textContent = msg;
  show("screenEnd");

  const ring = $("ring");
  ring.style.setProperty("--pct", 0);
  let cur = 0;
  const step = () => {
    cur = Math.min(pct, cur + Math.max(1, Math.round(pct / 40)));
    ring.style.setProperty("--pct", cur);
    if (cur < pct) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

$("btnStart").addEventListener("click", startQuiz);
$("btnNext").addEventListener("click", nextQuestion);
$("btnRestart").addEventListener("click", startQuiz);

/* keyboard shortcuts: A-D / 1-4 for options, T / F for True/False */
document.addEventListener("keydown", e => {
  if (!$("screenQuiz").classList.contains("active") || answered) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const q = order[idx];
  const k = e.key.toLowerCase();
  let i = -1;
  if (q.t === "tf"){
    if (k === "t" || k === "1") i = 0;
    else if (k === "f" || k === "2") i = 1;
  } else {
    const pos = ["a","b","c","d"].indexOf(k);
    i = pos >= 0 ? pos : ["1","2","3","4"].indexOf(k);
  }
  if (i >= 0) choose(i);
});
</script>
