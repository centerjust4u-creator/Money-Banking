<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money Quiz 4-2 | Center JUST</title>
<style>
:root{--navy:#0a1020;--navy2:#111b33;--parch:#f3ead3;--parch2:#e8dcbc;--ink:#1d2333;--gold:#c9a24b;--gold2:#e6c978;--blue:#1f5fbf;--red:#b3261e}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:radial-gradient(ellipse at top,#16213f 0%,var(--navy) 60%,#060a14 100%);color:var(--parch);font-family:Georgia,"Palatino Linotype",Palatino,"Times New Roman",serif;line-height:1.5;padding:18px 14px 40px;display:flex;justify-content:center}
.wrap{width:100%;max-width:760px}
.screen{display:none}.screen.on{display:block;animation:rise .5s ease}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{border-radius:50%;background:#000;border:3px solid var(--gold);box-shadow:0 0 0 5px rgba(201,162,75,.18),0 10px 30px rgba(0,0,0,.6)}
.logo.big{width:190px;height:190px}.logo.sm{width:54px;height:54px;border-width:2px;box-shadow:none}
.cj{color:var(--gold2);font-size:1.5rem;letter-spacing:.14em;margin-top:12px;font-weight:700}
.rule{height:2px;width:120px;margin:16px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
h1{font-size:clamp(2rem,7vw,3rem);color:var(--parch);text-align:center;font-weight:700;letter-spacing:.02em}
.sub{text-align:center;color:#c9c3ae;font-style:italic;font-size:1.1rem;margin:10px auto 22px;max-width:30em}
.counts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.chip{border:1px solid var(--gold);color:var(--gold2);border-radius:999px;padding:6px 16px;font-size:.98rem;background:rgba(201,162,75,.08)}
.btn{display:block;margin:0 auto;font:inherit;font-weight:700;font-size:1.15rem;color:#201605;background:linear-gradient(180deg,var(--gold2),var(--gold));border:0;border-radius:10px;padding:15px 38px;min-height:52px;cursor:pointer;box-shadow:0 5px 0 #8a6d28,0 10px 22px rgba(0,0,0,.45);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a6d28}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.top .b{display:flex;align-items:center;gap:10px;color:var(--gold2);font-weight:700;letter-spacing:.08em}
.score{color:var(--parch);font-size:.98rem;text-align:right}.score b{color:var(--gold2)}
.prog{height:9px;background:#1c2744;border-radius:9px;overflow:hidden;border:1px solid #2c3a62}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .4s}
.pn{margin:8px 0 14px;color:#c9c3ae;font-size:.98rem}
.card{background:linear-gradient(180deg,#f7efda,var(--parch2));color:var(--ink);border-radius:14px;padding:24px 20px;border:2px solid var(--gold);box-shadow:0 0 0 5px rgba(201,162,75,.16),0 16px 36px rgba(0,0,0,.55)}
.tag{display:inline-block;font-size:.85rem;color:#6b5314;border:1px solid #b89a4e;border-radius:6px;padding:2px 10px;margin-bottom:12px;background:rgba(201,162,75,.18)}
.q{font-size:clamp(1.15rem,3.6vw,1.45rem);line-height:1.4;font-weight:700;margin-bottom:18px}
.opts{display:grid;gap:11px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:#fffaf0;border:2px solid #cdbd90;border-radius:10px;padding:13px 14px;min-height:52px;cursor:pointer;transition:transform .12s,background .15s,border-color .15s}
.opt:hover:not(:disabled){border-color:var(--gold);background:#fff;transform:translateX(3px)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--navy2);color:var(--gold2);display:grid;place-items:center;font-weight:700;font-size:.95rem}
.opt:disabled{cursor:default}
.opt.ok{background:var(--blue);border-color:#143f85;color:#fff}.opt.ok .l{background:#fff;color:var(--blue)}
.opt.bad{background:var(--red);border-color:#7d1a14;color:#fff;animation:shake .35s}.opt.bad .l{background:#fff;color:var(--red)}
.opt.dim{opacity:.55}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{display:none;margin-top:18px;border-radius:10px;padding:14px 16px;border-left:6px solid}
.fb.on{display:block;animation:rise .35s}
.fb.ok{background:#dfe9fa;border-color:var(--blue)}.fb.bad{background:#f7dedb;border-color:var(--red)}
.fb strong{display:block;font-size:1.1rem;margin-bottom:4px}.fb.ok strong{color:#164a99}.fb.bad strong{color:#8f1d17}
.nx{margin-top:20px;display:none}.nx.on{display:block}
.res{text-align:center}
.big-score{font-size:clamp(3rem,14vw,5rem);color:var(--gold2);font-weight:700;line-height:1.1;margin:6px 0}
.pct{color:#c9c3ae;margin-bottom:8px}.msg{max-width:28em;margin:0 auto 26px;font-style:italic;color:var(--parch)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:480px){.logo.big{width:150px;height:150px}.card{padding:18px 14px}}
</style>
</head>

var QUESTIONS = [
{t:"tf",q:"Commercial banks raise funds primarily through checkable deposits, savings deposits, and time deposits.",a:true,e:"Deposits of these three kinds are the main source of funds for commercial banks."},
{t:"tf",q:"Savings deposits allow their owners to write checks directly on them.",a:false,e:"Check writing is a feature of checkable deposits. Savings deposits do not allow it."},
{t:"tf",q:"Commercial banks are the largest financial intermediaries and hold the most diversified portfolios of assets.",a:true,e:"Banks are the biggest intermediaries and spread their funds across the widest range of assets."},
{t:"tf",q:"Savings and loan associations have historically focused mainly on mortgage loans for residential housing.",a:true,e:"Residential mortgages have traditionally been the core business of savings and loan associations."},
{t:"tf",q:"Credit unions primarily make commercial loans to large corporations.",a:false,e:"Credit unions mainly make consumer loans to their members, not commercial loans to large corporations."},
{t:"tf",q:"Contractual savings institutions acquire funds at periodic intervals on a contractual basis.",a:true,e:"Insurance companies and pension funds receive premiums or contributions regularly under contracts."},
{t:"tf",q:"Liquidity of assets is generally more important to contractual savings institutions than to depository institutions.",a:false,e:"Contractual savings institutions can predict future payouts fairly accurately, so liquidity matters less to them than to depository institutions."},
{t:"tf",q:"Life insurance companies obtain funds mainly from premiums and invest primarily in corporate bonds and mortgages.",a:true,e:"Premiums are their main source of funds, and corporate bonds and mortgages are their main investments."},
{t:"tf",q:"Fire and casualty insurance companies generally hold more liquid assets than life insurance companies do.",a:true,e:"They can face large losses from major disasters, so they keep more liquid assets."},
{t:"tf",q:"Mutual funds use the money raised from selling shares to buy diversified portfolios of stocks and bonds.",a:true,e:"Pooling shareholders' money lets mutual funds hold diversified portfolios of securities."},
{t:"tf",q:"Money market mutual funds invest primarily in risky and illiquid securities.",a:false,e:"Money market mutual funds invest in safe, liquid, short-term securities."},
{t:"tf",q:"Hedge funds are subject to stronger regulation than other mutual funds.",a:false,e:"Hedge funds are organized as limited partnerships and face weaker regulation than other mutual funds."},
{t:"tf",q:"Investment banks normally accept deposits from individuals and use them to make loans.",a:false,e:"Despite the name, investment banks do not take deposits and lend them out. They help corporations issue and sell securities."},
{t:"tf",q:"One reason for regulating the financial system is to increase the information available to investors.",a:true,e:"Regulation requires disclosure, which gives investors more information to work with."},
{t:"tf",q:"Deposit insurance is intended, among other things, to help avoid bank runs.",a:true,e:"Insuring deposits reassures depositors, so they have less reason to rush to withdraw their money."},

{t:"mc",q:"Which of the following is a depository institution?",o:["Hedge fund","Credit union","Life insurance company","Pension fund"],a:1,e:"Credit unions take deposits (called shares) from their members, which makes them depository institutions."},
{t:"mc",q:"Which type of deposit has a fixed term to maturity?",o:["Savings deposit","Checkable deposit","Time deposit","Share deposit"],a:2,e:"A time deposit is held for a fixed period until it matures."},
{t:"mc",q:"Credit unions obtain funds from deposits called:",o:["Premiums","Shares","Annuities","Commercial paper"],a:1,e:"Members' deposits at credit unions are called shares."},
{t:"mc",q:"Which financial intermediary primarily makes consumer loans and is often organized around the employees of a particular firm?",o:["Credit union","Investment bank","Pension fund","Life insurance company"],a:0,e:"Credit unions are small cooperative lenders that often serve employees of one firm and lend mostly to consumers."},
{t:"mc",q:"Why is asset liquidity less important for contractual savings institutions?",o:["They can predict future benefit payments with reasonable accuracy","They make benefit payments so rarely that cash reserves are unnecessary","Their assets are fully guaranteed by the government","They invest only in cash and cash equivalents"],a:0,e:"Because they can forecast benefit payments reasonably well, they do not need to hold many liquid assets."},
{t:"mc",q:"Life insurance companies mainly use their funds to purchase:",o:["Corporate bonds and mortgages","Commercial paper only","Foreign currencies only","Consumer loans"],a:0,e:"Life insurers invest mostly in corporate bonds and mortgages."},
{t:"mc",q:"Which institution provides retirement income in the form of annuities?",o:["Finance company","Credit union","Pension fund","Investment bank"],a:2,e:"Pension funds collect contributions during working years and pay retirement income as annuities."},
{t:"mc",q:"Finance companies raise funds by:",o:["Accepting only savings deposits from households","Selling commercial paper and issuing stocks and bonds","Collecting insurance premiums from policyholders","Collecting employee contributions only"],a:1,e:"Finance companies sell commercial paper and issue stocks and bonds to raise funds."},
{t:"mc",q:"A major advantage of mutual funds is that they allow investors to:",o:["Eliminate all investment risk","Avoid fluctuations in security prices altogether","Achieve lower transaction costs and greater diversification","Receive guaranteed returns every year"],a:2,e:"Pooling funds cuts transaction costs and lets small investors diversify. It does not remove risk or guarantee returns."},
{t:"mc",q:"Which feature makes money market mutual funds similar to depository institutions?",o:["They provide long-term mortgage loans","Shareholders can write checks against their holdings in deposit-type accounts","They issue insurance policies against losses","They pay retirement annuities to retired workers"],a:1,e:"They offer deposit-type accounts and let shareholders write checks against their shareholdings."},
{t:"mc",q:"Which statement about hedge funds is correct?",o:["They are more heavily regulated than other mutual funds","They can invest only in government securities","They are limited partnerships and face weaker regulation than other mutual funds","They accept checkable deposits"],a:2,e:"Hedge funds are organized as limited partnerships and face weaker regulation than other mutual funds."},
{t:"mc",q:"What does an investment bank primarily help corporations do?",o:["Accept consumer deposits","Issue and sell securities","Provide life insurance","Provide residential mortgages"],a:1,e:"Investment banks help corporations issue and sell securities."},
{t:"mc",q:"Which of the following is NOT a main reason for government regulation of the financial system?",o:["Increasing the information available to investors","Ensuring the soundness of financial intermediaries","Guaranteeing profits for financial intermediaries","Protecting the functioning of the financial system"],a:2,e:"Regulation aims at information and soundness, not at guaranteeing profits for intermediaries."},
{t:"mc",q:"Strict requirements concerning experience, credentials, and initial financing are associated with:",o:["Deposit insurance","Restriction on entry","Restrictions on risky assets","Mutual fund diversification"],a:1,e:"Restriction on entry limits who may open a financial intermediary by requiring experience, credentials, and initial financing."},
{t:"mc",q:"Which regulatory measure directly protects depositors from major financial losses if a financial intermediary fails?",o:["Periodic inspection","Restriction on entry","Deposit insurance","Restrictions on assets"],a:2,e:"Deposit insurance reimburses depositors if the institution fails."}

    var b=document.createElement("button");
    b.type="button";b.className="opt";
    var l=document.createElement("span");l.className="l";l.textContent=q.t==="tf"?(it.val?"T":"F"):"ABCD".charAt(i);
    var s=document.createElement("span");s.textContent=it.label;
    b.appendChild(l);b.appendChild(s);
    b._correct=(q.t==="tf")?(it.val===q.a):it.val;
    b.onclick=function(){answer(b)};
    box.appendChild(b);
  });
}

function answer(btn){
  if(locked)return;locked=true;
  var q=order[idx],good=btn._correct;
  var all=$("opts").children;
  for(var i=0;i<all.length;i++){
    all[i].disabled=true;
    if(all[i]._correct)all[i].classList.add("ok");
    else if(all[i]===btn)all[i].classList.add("bad");
    else all[i].classList.add("dim");
  }
  if(good){right++;$("sc").textContent=right}
  $("fb").className="fb on "+(good?"ok":"bad");
  $("fbT").textContent=good?"Correct!":"Incorrect";
  $("fbE").textContent=q.e;
  $("nextBtn").classList.add("on");
  $("nextBtn").focus({preventScroll:true});
  $("bar").style.width=((idx+1)/order.length*100)+"%";
}

function next(){
  idx++;
  if(idx>=order.length)finish();else render();
}

function finish(){
  var n=order.length,p=Math.round(right/n*100);
  $("final").textContent=right+" / "+n;
  $("pct").textContent=p+"% correct";
  $("msg").textContent=p>=90?"Outstanding work. Your command of this material is excellent.":p>=70?"Well done. You have a solid grasp of the material.":p>=50?"A decent start. Review the explanations and try again.":"Keep practicing. Another round will help the ideas stick.";
  show("end");
}

$("startBtn").onclick=start;
$("nextBtn").onclick=next;
$("restartBtn").onclick=start;
</script>
</body>
</html>
