<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money &amp; Banking Quiz 2 - Center JUST</title>
<style>
:root{--navy:#0b1630;--navy2:#14295a;--parch:#fbf4e0;--parch2:#f1e4bf;--gold:#d4a62a;--gold2:#f3d36b;--blue:#1d5fd1;--red:#d93a3a;--green:#1f9d4c;--ink:#1c2540}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#0b1630,#17306b 45%,#0e3d4a 75%,#0b1630);background-size:300% 300%;animation:bg 18s ease infinite;min-height:100vh;display:flex;justify-content:center;padding:18px 14px 40px;overflow-x:hidden}
@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;z-index:0;pointer-events:none}
.b1{width:300px;height:300px;background:#e8453c;top:-80px;left:-80px}
.b2{width:340px;height:340px;background:#1f9d4c;bottom:-100px;right:-80px}
.b3{width:260px;height:260px;background:#d4a62a;top:40%;left:60%}
.wrap{position:relative;z-index:1;width:100%;max-width:720px}
.brand{text-align:center;color:#fff;margin-bottom:14px}
.brand img{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.brand .nm{font-family:Georgia,"Times New Roman",serif;font-size:1.25rem;font-weight:700;color:var(--gold2);letter-spacing:.5px}
.card{background:linear-gradient(180deg,var(--parch),var(--parch2));border:3px solid var(--gold);border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 0 0 4px rgba(255,255,255,.35);padding:26px 22px}
.screen{display:none}.screen.on{display:block;animation:pop .45s ease}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2rem,7vw,2.8rem);margin:6px 0;text-align:center;background:linear-gradient(90deg,#1d5fd1,#7b3fe4,#d93a3a,#e68a00);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;font-size:1.08rem;color:#3b4468;margin:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:0 0 22px}
.chip{padding:9px 16px;border-radius:999px;color:#fff;font-weight:700;font-size:.95rem;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.c1{background:linear-gradient(135deg,#1d5fd1,#4a8bff)}.c2{background:linear-gradient(135deg,#1f9d4c,#52c97c)}.c3{background:linear-gradient(135deg,#e68a00,#f5b942)}
.btn{display:block;width:100%;border:0;cursor:pointer;font:700 1.15rem inherit;font-family:inherit;padding:16px;border-radius:14px;color:#fff;background:linear-gradient(135deg,#e8453c,#d4a62a);box-shadow:0 6px 0 #9a6f10,0 10px 20px rgba(0,0,0,.25);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #9a6f10}
#start{font-size:1.7rem;font-weight:800;padding:20px;letter-spacing:.5px}
.btn.blue{background:linear-gradient(135deg,#1d5fd1,#7b3fe4);box-shadow:0 6px 0 #10388a,0 10px 20px rgba(0,0,0,.25)}
.btn.blue:active{box-shadow:0 2px 0 #10388a}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #7b3fe4;outline-offset:3px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-weight:700;font-size:.95rem}
.pill{padding:6px 12px;border-radius:999px;background:var(--navy);color:var(--gold2)}
.pill.sc{background:linear-gradient(135deg,#1f9d4c,#1d5fd1);color:#fff}
.bar{height:12px;background:rgba(11,22,48,.15);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e8453c,#e68a00,#1f9d4c,#1d5fd1,#7b3fe4);border-radius:99px;transition:width .5s}
.kind{display:inline-block;padding:4px 12px;border-radius:8px;font-size:.85rem;font-weight:700;color:#fff;margin-bottom:10px}
.kind.tf{background:#7b3fe4}.kind.mc{background:#e68a00}
.q{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.2rem,4.4vw,1.5rem);line-height:1.4;margin:0 0 18px;font-weight:700}
.opts{display:grid;gap:11px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:1.05rem;padding:14px;min-height:56px;background:#fff;border:2.5px solid #d9c98f;border-radius:14px;cursor:pointer;color:var(--ink);transition:transform .12s,border-color .12s,background .2s}
.opt:hover:not([disabled]){transform:translateX(4px);border-color:var(--gold)}
.opt .l{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff}
.opt:nth-child(1) .l{background:#7b3fe4}.opt:nth-child(2) .l{background:#e68a00}.opt:nth-child(3) .l{background:#1f9d4c}.opt:nth-child(4) .l{background:#d6336c}
.opt[disabled]{cursor:default}
.opt.right{background:#e3eeff;border-color:var(--blue);color:#0c3a8a;font-weight:700}
.opt.right .l{background:var(--blue)}
.opt.wrong{background:#ffe5e5;border-color:var(--red);color:#8a1414;animation:shake .4s}
.opt.wrong .l{background:var(--red)}
.opt.dim{opacity:.55}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{display:none;margin-top:18px;padding:14px 16px;border-radius:14px;border-left:8px solid}
.fb.on{display:block;animation:pop .35s}
.fb.ok{background:#e3eeff;border-color:var(--blue)}.fb.no{background:#ffe5e5;border-color:var(--red)}
.fb b{display:block;font-size:1.15rem;margin-bottom:4px}
.fb.ok b{color:var(--blue)}.fb.no b{color:var(--red)}
.fb p{margin:0;line-height:1.5}
#next{margin-top:16px;display:none}
.big{font-family:Georgia,serif;font-size:clamp(3rem,13vw,5rem);font-weight:800;text-align:center;margin:4px 0;background:linear-gradient(90deg,#1d5fd1,#1f9d4c,#e68a00,#d93a3a);-webkit-background-clip:text;background-clip:text;color:transparent}
.msg{text-align:center;font-size:1.2rem;font-weight:700;margin:0 0 20px}
.res-logo{display:block;margin:0 auto 4px;width:90px;height:90px;object-fit:contain}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <div class="card">
    <section id="intro" class="screen on">
      <h1>Money &amp; Banking Quiz 2</h1>
      <p class="sub">Welcome to Center JUST, please answer the following questions.</p>
      <div class="chips"><span class="chip c1" id="cTotal"></span><span class="chip c2" id="cTF"></span><span class="chip c3" id="cMC"></span></div>
      <button class="btn" id="start">Start Quiz</button>
    </section>

      <div class="top"><span class="pill" id="prog"></span><span class="pill sc" id="score"></span></div>

<script>
var QS=[
{t:"tf",q:"Banks are the largest financial intermediaries in the economy.",a:true,e:"Banks are the largest financial intermediaries, although other institutions also matter."},
{t:"tf",q:"Financial innovation can sometimes lead to devastating financial crises.",a:true,e:"Innovation can make the system more efficient, but it also has a dark side that can lead to crises."},
{t:"tf",q:"Financial crises are characterized by sharp rises in asset prices.",a:false,e:"Financial crises involve sharp declines in asset prices and the failure of many firms."},
{t:"tf",q:"In general, an increase in the money supply leads to an increase in inflation.",a:true,e:"The price level and the money supply generally rise together."},
{t:"tf",q:"To decrease the money supply, the central bank should lower the reserve ratio.",a:false,e:"To decrease the money supply the reserve ratio is raised, leaving less money for banks to lend."},
{t:"tf",q:"A budget deficit occurs when tax revenues exceed government expenditures.",a:false,e:"That describes a surplus. A deficit is when government expenditures exceed revenues."},
{t:"tf",q:"A government must finance any budget deficit by borrowing.",a:true,e:"Deficits are financed by borrowing, for example by issuing bonds or Treasury bills."},
{t:"tf",q:"The purchase of stocks or bonds is included in GDP.",a:false,e:"Stocks and bonds are not goods and services produced during the year, so they are excluded."},
{t:"tf",q:"Buying a house that was built twenty years ago is counted in this year's GDP.",a:false,e:"GDP counts only goods and services produced in the current year, not past production."},
{t:"tf",q:"Aggregate income equals aggregate output.",a:true,e:"Payments for final goods and services flow back to the owners of the factors of production as income."},
{t:"tf",q:"Real GDP is measured using current prices.",a:false,e:"That is nominal GDP. Real GDP is measured with constant (fixed) prices."},
{t:"tf",q:"If all prices doubled while actual production stayed the same, nominal GDP would double.",a:true,e:"Nominal GDP uses current prices, so it can be a misleading measure of economic well-being."},
{t:"tf",q:"The foreign exchange market determines the foreign exchange rate.",a:true,e:"The foreign exchange market is where currencies are converted, and it sets the exchange rate."},
{t:"tf",q:"A policy clash happens when the central bank tightens the money supply to reduce inflation while the government sharply increases spending.",a:true,e:"Fiscal and monetary policies must be coordinated to avoid working against each other."},
{t:"mc",q:"Which type of institution accepts deposits and makes loans?",o:["Banks","Insurance companies","Mutual funds","Pension funds"],a:0,e:"Banks accept deposits and make loans, and they are the intermediaries people deal with most often."},
{t:"mc",q:"What does financial innovation mean?",o:["Closing unprofitable banks","Developing new financial products and services","Raising taxes on firms","Printing more currency"],a:1,e:"Financial innovation is the development of new financial products and services."},
{t:"mc",q:"What is E-finance?",o:["Lending only to governments","Trading in foreign currencies only","Delivering financial services electronically","A type of insurance policy"],a:2,e:"Improvements in information technology made it possible to deliver financial services electronically."},
{t:"mc",q:"What triggered the crisis that began in the U.S. in August 2007?",o:["Defaults on subprime residential mortgages","A fall in government spending","A rise in the reserve ratio","A shortage of printed currency"],a:0,e:"Defaults on subprime mortgages caused major losses and many bank failures. The resulting recession is called the Great Recession."},
{t:"mc",q:"How is money defined?",o:["Only paper currency","Gold held by the central bank","Anything generally accepted in payment for goods, services or debts","Any asset that earns interest"],a:2,e:"Money is anything generally accepted in payment for goods or services or in repayment of debts."},
{t:"mc",q:"Which organization is responsible for conducting a country's monetary policy?",o:["The Ministry of Finance","The central bank","Insurance companies","Commercial banks"],a:1,e:"The central bank conducts monetary policy. In the U.S. this is the Federal Reserve Bank."},
{t:"mc",q:"What happens to the money supply when the central bank sells bonds or Treasury bills to the public?",o:["It increases","It stays the same","It decreases","It doubles"],a:2,e:"Selling bonds takes cash out of circulation, which decreases the money supply. Buying them back increases it."},
{t:"mc",q:"What is the reserve ratio?",o:["The interest rate on loans between banks","The share of GDP spent by the government","The percentage of deposits banks must keep at the central bank","The share of loans that default"],a:2,e:"The reserve ratio is the percentage of deposits that banks must keep at the central bank."},
{t:"mc",q:"Which action would INCREASE the money supply?",o:["Raising the reserve ratio","Selling Treasury bills to the public","Decreasing the reserve ratio","Raising taxes"],a:2,e:"A lower reserve ratio leaves more money available for banks to lend."},
{t:"mc",q:"Fiscal policy involves decisions about which of the following?",o:["Exchange rates and tariffs","Government spending and taxation","Deposit insurance and mortgages","Interest on savings accounts"],a:1,e:"Fiscal policy is the set of government decisions about spending and taxation."},
{t:"mc",q:"What does GDP measure?",o:["The total wealth of all households","The market value of all final goods and services produced in a country in one year","The total money supply","The government's tax revenue"],a:1,e:"GDP is a measure of aggregate output: the market value of final goods and services produced in a year."},
{t:"mc",q:"Why are intermediate goods, such as the sugar in a candy bar, not counted separately in GDP?",o:["They are illegal to trade","They are produced abroad","Their value is already included in final goods, so they would be counted twice","They have no market value"],a:2,e:"The value of final goods already includes the value of intermediate goods, so counting both would be double counting."},
{t:"mc",q:"Real GDP grows from $9 trillion in 2022 to $9.5 trillion in 2023. What is the growth rate for 2023?",o:["0.5%","5.6%","9.5%","50%"],a:1,e:"Growth rate = (9.5 - 9) / 9, which is about 5.6%."},
{t:"mc",q:"How is the inflation rate defined?",o:["The growth rate of real GDP","The growth rate of the money supply","The growth rate of the aggregate price level","The change in the exchange rate"],a:2,e:"The inflation rate is the growth rate of the aggregate price level."},
{t:"mc",q:"What is the foreign exchange rate?",o:["The tax on imported goods","The price of one currency in terms of another currency","The interest rate set by the central bank","The amount of foreign debt a country owes"],a:1,e:"The foreign exchange rate is the price of one currency in terms of another."},
{t:"mc",q:"Which countries tend to have the highest inflation rates?",o:["Those with the highest money growth rates","Those with the lowest taxes","Those with the most banks","Those with the largest GDP"],a:0,e:"Countries with the highest inflation rates are also the ones with the highest money growth rates."}
];
var $=function(i){return document.getElementById(i)};
var order=[],idx=0,score=0,locked=false,cur=null;
var nTF=QS.filter(function(q){return q.t==="tf"}).length,nMC=QS.length-nTF;
$("cTotal").textContent=QS.length+" Questions";
$("cTF").textContent=nTF+" True / False";
$("cMC").textContent=nMC+" Multiple Choice";
$("rlogo").src=document.querySelector(".brand img").src;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function show(id){["intro","game","end"].forEach(function(s){$(s).classList.toggle("on",s===id)});window.scrollTo(0,0)}
function begin(){order=shuffle(QS);idx=0;score=0;stopFx();show("game");render()}
function render(){
  var q=order[idx];locked=false;
  $("prog").textContent="Question "+(idx+1)+" of "+order.length;
  $("score").textContent="Correct: "+score;
  $("barfill").style.width=(idx/order.length*100)+"%";
  var k=$("kind");k.textContent=q.t==="tf"?"True / False":"Multiple Choice";k.className="kind "+q.t;
  $("qtext").textContent=q.q;
  $("fb").className="fb";$("next").style.display="none";
  var box=$("opts");box.innerHTML="";
  var items=q.t==="tf"?[{txt:"True",ok:q.a===true},{txt:"False",ok:q.a===false}]
    :shuffle(q.o.map(function(o,i){return{txt:o,ok:i===q.a}}));
  cur=items;
  items.forEach(function(it,i){
    var b=document.createElement("button");b.className="opt";b.type="button";
    var l=document.createElement("span");l.className="l";l.textContent=String.fromCharCode(65+i);
    var s=document.createElement("span");s.textContent=it.txt;
    b.appendChild(l);b.appendChild(s);
    b.onclick=function(){pick(i)};
    box.appendChild(b);
  });
}
function pick(i){
  if(locked)return;locked=true;
  var q=order[idx],btns=$("opts").children,good=cur[i].ok;
  for(var j=0;j<btns.length;j++){btns[j].disabled=true;
    if(cur[j].ok)btns[j].classList.add("right");
    else if(j===i)btns[j].classList.add("wrong");
    else btns[j].classList.add("dim");}
  if(good)score++;
  $("score").textContent="Correct: "+score;
  var fb=$("fb");fb.className="fb on "+(good?"ok":"no");
  $("fbt").textContent=good?"Correct! Well done.":"Incorrect.";
  $("fbp").textContent=q.e;
  var n=$("next");n.style.display="block";
  n.textContent=idx===order.length-1?"See my score":"Next question";
  if(good)burst(window.innerWidth/2,window.innerHeight/3,26);
}
function next(){idx++;if(idx>=order.length)finish();else render()}
function finish(){
  show("end");
  $("final").textContent=score+" / "+order.length;
  var p=score/order.length,m;
  if(p===1)m="Perfect score! Outstanding!";else if(p>=.8)m="Excellent work!";else if(p>=.6)m="Good job, keep practicing!";else m="Keep studying and try again!";
  $("fmsg").textContent=m;
  if(p>=.6)rain();
}
$("start").onclick=begin;$("restart").onclick=begin;$("next").onclick=next;
/* confetti */
var cv=$("fx"),cx=cv.getContext("2d"),ps=[],raf=null,cols=["#e8453c","#d4a62a","#1f9d4c","#1d5fd1","#7b3fe4","#d6336c","#f3d36b"];
function size(){cv.width=window.innerWidth;cv.height=window.innerHeight}
size();window.addEventListener("resize",size);
function burst(x,y,n){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=3+Math.random()*6;ps.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,c:cols[i%cols.length],w:6+Math.random()*6,r:Math.random()*6,l:70})}loop()}
function rain(){for(var i=0;i<120;i++)ps.push({x:Math.random()*cv.width,y:-Math.random()*cv.height*.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,c:cols[i%cols.length],w:6+Math.random()*7,r:Math.random()*6,l:260});loop()}
function loop(){if(raf)return;(function f(){cx.clearRect(0,0,cv.width,cv.height);
  ps=ps.filter(function(p){return p.l>0&&p.y<cv.height+20});
  ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.r+=.2;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);cx.restore()});
  if(ps.length)raf=requestAnimationFrame(f);else{raf=null;cx.clearRect(0,0,cv.width,cv.height)}})()}
function stopFx(){ps=[]}
</script>
