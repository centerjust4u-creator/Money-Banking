<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money &amp; Banking Midterm Quiz | Center JUST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-0:#070d1c; --navy-1:#0c1630; --navy-2:#13213f; --navy-3:#1c2e55;
  --parch:#f4ecd8; --parch-2:#e9dcbc; --ink:#22201a; --ink-soft:#5b5443;
  --brass:#c9a24a; --brass-2:#e6c776; --brass-dark:#8a6a24;
  --blue:#1f5fbf; --blue-bg:#dde8fa; --red:#b3261e; --red-bg:#f8dedb;
  --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans:'Source Sans 3', 'Segoe UI', Roboto, Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:var(--sans); color:var(--parch);
  background:
    radial-gradient(ellipse at 50% -10%, #1f3566 0%, transparent 55%),
    radial-gradient(ellipse at 100% 100%, #16244a 0%, transparent 50%),
    linear-gradient(180deg,var(--navy-1),var(--navy-0));
  background-attachment:fixed;
  display:flex; justify-content:center; padding:24px 16px 40px;
}
.wrap{width:100%; max-width:760px}
.screen{display:none; animation:fade .45s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ornaments */
.rule{display:flex;align-items:center;gap:12px;color:var(--brass);margin:14px auto;max-width:360px}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--brass),transparent)}
.rule span{font-size:14px;letter-spacing:.3em}

/* intro */
.intro{text-align:center; padding:28px 22px 34px; border:1px solid rgba(201,162,74,.45); border-radius:18px;
  background:linear-gradient(180deg,rgba(28,46,85,.65),rgba(12,22,48,.85)); box-shadow:0 20px 60px rgba(0,0,0,.45), inset 0 0 0 6px rgba(201,162,74,.06)}
.logo-big{width:170px;height:170px;object-fit:contain;filter:drop-shadow(0 8px 22px rgba(0,0,0,.55));animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.brand{font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:.18em;color:var(--brass-2);margin-top:8px;text-transform:uppercase}
.intro h1{font-family:var(--serif);font-size:clamp(38px,8vw,58px);line-height:1.05;color:var(--parch);margin-top:6px}
.subtitle{color:#cfd6e6;font-size:17px;margin:6px auto 0;max-width:480px;line-height:1.5}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:24px 0 28px}
.stat{min-width:120px;padding:14px 16px;border-radius:12px;background:rgba(244,236,216,.06);border:1px solid rgba(201,162,74,.3)}
.stat b{display:block;font-family:var(--serif);font-size:34px;color:var(--brass-2);line-height:1}
.stat small{display:block;margin-top:6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#aeb8cf}

.btn{font-family:var(--sans);font-weight:700;font-size:17px;letter-spacing:.04em;border:none;cursor:pointer;
  padding:15px 34px;border-radius:999px;color:var(--navy-0);
  background:linear-gradient(180deg,var(--brass-2),var(--brass));box-shadow:0 6px 0 var(--brass-dark),0 12px 24px rgba(0,0,0,.35);
  transition:transform .12s, box-shadow .12s, filter .2s; min-height:52px}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--brass-dark),0 6px 12px rgba(0,0,0,.35)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* header */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top img{width:52px;height:52px;object-fit:contain}
.top .t{flex:1;min-width:0}
.top .t div{font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:.14em;color:var(--brass-2);text-transform:uppercase}
.top .t h2{font-family:var(--serif);font-size:24px;color:var(--parch);line-height:1.1}
.score-pill{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid rgba(201,162,74,.5);background:rgba(201,162,74,.1);font-weight:700;white-space:nowrap}
.score-pill .star{color:var(--brass-2)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#c4cce0;margin-bottom:8px;gap:8px}
.streak{color:var(--brass-2);font-weight:700;opacity:0;transition:opacity .3s}
.streak.on{opacity:1}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:18px;border:1px solid rgba(201,162,74,.2)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brass),var(--brass-2));transition:width .45s ease}

/* card */
.card{position:relative;background:linear-gradient(180deg,var(--parch),var(--parch-2));color:var(--ink);
  border-radius:16px;padding:26px 22px 22px;box-shadow:0 24px 60px rgba(0,0,0,.5);border:1px solid #d9c690}
.card::before{content:"";position:absolute;inset:7px;border:1px solid rgba(138,106,36,.35);border-radius:11px;pointer-events:none}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  padding:5px 11px;border-radius:999px;background:var(--navy-2);color:var(--brass-2);margin-bottom:12px}
.q{font-family:var(--serif);font-weight:700;font-size:clamp(22px,4.6vw,27px);line-height:1.3;margin-bottom:20px}
.opts{display:grid;gap:11px}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-family:var(--sans);font-size:17px;line-height:1.4;color:var(--ink);
  background:#fffaf0;border:2px solid #d8c79c;border-radius:12px;padding:13px 14px;cursor:pointer;min-height:56px;
  transition:transform .12s, border-color .15s, background .15s, box-shadow .15s}
.opt:hover:not(:disabled){border-color:var(--brass);transform:translateY(-2px);box-shadow:0 6px 14px rgba(138,106,36,.18)}
.opt:focus-visible{outline:3px solid var(--navy-3);outline-offset:2px}
.opt .k{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;
  background:var(--navy-2);color:var(--brass-2)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--blue);background:var(--blue-bg)}
.opt.correct .k{background:var(--blue);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-bg);animation:shake .4s}
.opt.wrong .k{background:var(--red);color:#fff}
.opt.dim{opacity:.55}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.opt.correct.picked{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.03)}}

.fb{display:none;margin-top:18px;padding:14px 16px;border-radius:12px;border-left:5px solid;font-size:16px;line-height:1.5}
.fb.show{display:block;animation:fade .35s}
.fb.ok{background:var(--blue-bg);border-color:var(--blue)}
.fb.no{background:var(--red-bg);border-color:var(--red)}
.fb strong{display:block;font-size:17px;margin-bottom:3px}
.fb.ok strong{color:var(--blue)} .fb.no strong{color:var(--red)}
.next-row{display:flex;justify-content:flex-end;margin-top:18px}
.next-row .btn{display:none}
.next-row .btn.show{display:inline-block;animation:fade .3s}

/* results */
.result{text-align:center;padding:30px 22px 34px;border:1px solid rgba(201,162,74,.45);border-radius:18px;
  background:linear-gradient(180deg,rgba(28,46,85,.65),rgba(12,22,48,.85));box-shadow:0 20px 60px rgba(0,0,0,.45)}
.result img{width:120px;height:120px;object-fit:contain}
.ring{width:190px;height:190px;margin:18px auto 10px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-weight:700}
.ring .val b{font-size:46px;color:var(--parch);line-height:1}
.ring .val small{display:block;font-family:var(--sans);font-size:14px;color:#aeb8cf;margin-top:4px;font-weight:600}
.verdict{font-family:var(--serif);font-size:30px;color:var(--brass-2);margin:6px 0}
.result p{color:#cfd6e6;margin-bottom:24px;font-size:17px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:drop linear forwards}
@keyframes drop{to{transform:translateY(110vh) rotate(720deg);opacity:.7}}

@media (max-width:520px){
  body{padding:14px 12px 30px}
  .card{padding:22px 16px 18px}
  .opts.tf{grid-template-columns:1fr}
  .top .t h2{font-size:20px}
  .logo-big{width:140px;height:140px}
  .btn{width:100%}
  .next-row{justify-content:stretch}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

      <div class="opts" id="opts"></div>
      <div class="fb" id="fb"></div>
      <div class="next-row"><button class="btn" id="nextBtn">Next question</button></div>
    </div>
  </section>

  <!-- RESULT -->
  <section class="screen" id="result">
    <div class="result">
      <img src="" data-logo alt="Center JUST logo">
      <div class="brand">Center JUST</div>
      <div class="ring">
        <svg width="190" height="190" viewBox="0 0 190 190">
          <circle cx="95" cy="95" r="82" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="12"/>
          <circle id="ringArc" cx="95" cy="95" r="82" fill="none" stroke="#e6c776" stroke-width="12" stroke-linecap="round" stroke-dasharray="515.2" stroke-dashoffset="515.2" style="transition:stroke-dashoffset 1.2s ease"/>
        </svg>
        <div class="val"><div><b id="finalScore">0/0</b><small id="finalPct">0%</small></div></div>
      </div>
      <div class="verdict" id="verdict"></div>
      <p id="verdictMsg"></p>
      <button class="btn" id="restartBtn">Restart the Quiz</button>
    </div>
  </section>
</div>

<script>
// q: question, o: options (first entry = correct, shuffled at runtime)
// tf: questions with t: true/false boolean answer
const QUESTIONS = [{"q": "Income is the total collection of pieces of property that serve to store value.", "t": false}, {"q": "Wealth is the total collection of pieces of property that serve to store value.", "t": true}, {"q": "A borrower usually knows more about the potential returns and risk of his investment projects than the lender does. This inequality of information is called adverse selection.", "t": false}, {"q": "The problem created by asymmetric information before a transaction occurs is called free riding, while the problem created after the transaction occurs is called moral hazard.", "t": false}, {"q": "The problem created by asymmetric information before a transaction occurs is called adverse selection, while the problem created after the transaction occurs is called moral hazard.", "t": true}, {"q": "If the maturity term of an asset is less than a year, it is a long-term asset.", "t": false}, {"q": "If the maturity term of an asset is less than a year, it is a short-term asset.", "t": true}, {"q": "Common stock is a contractual agreement by the borrower to pay the holder the principal at the maturity date and interest payments at regular intervals.", "t": false}, {"q": "The secondary market is the financial market in which new issues of a security are sold to initial buyers.", "t": false}, {"q": "The primary market is the financial market in which new issues of a security are sold to initial buyers.", "t": true}, {"q": "Corporate bonds are considered long-term securities because they have no maturity date.", "t": false}, {"q": "Stocks are considered long-term securities because they have no maturity date.", "t": true}, {"q": "The capital market is the financial market in which only short-term debt instruments are traded.", "t": false}, {"q": "Moral hazard is the problem created by asymmetric information before the transaction occurs.", "t": false}, {"q": "Adverse selection is the problem created by asymmetric information before the transaction occurs.", "t": true}, {"q": "Moral hazard refers to the risk that the borrower might engage in activities that are undesirable from the lender's point of view.", "t": true}, {"q": "Monetary policy is the management of the money supply and interest rates.", "t": true}, {"q": "When you make a deposit at a bank, this is considered direct finance.", "t": false}, {"q": "When a person makes a deposit at a bank, this is considered indirect finance.", "t": true}, {"q": "Financial markets transfer funds from economic players who have surplus funds to those that have a shortage of funds.", "t": true}, {"q": "The secondary market makes financial instruments more liquid.", "t": true}, {"q": "Money market securities are safer because their prices fluctuate less than those of longer-term securities.", "t": true}, {"q": "Mortgages are loans to households or firms to purchase land, housing or other real structures, where the structure or land itself serves as collateral for the loan.", "t": true}, {"q": "Transaction cost is the time and money spent in carrying out financial transactions.", "t": true}, {"q": "Financial intermediaries promote risk sharing by letting individuals diversify risk through investing in a portfolio of assets whose returns do not always move together.", "t": true}, {"q": "When I purchase a bond, I own a portion of the corporation that issued it and have the right to vote on important issues and to elect its directors.", "t": false}, {"q": "A liquid asset is an asset that can easily and quickly be sold to raise cash.", "t": true}, {"q": "The reduction in transaction costs per dollar of investment as the size of transactions increases is called economies of scale.", "t": true}, {"q": "The reduction in transaction costs per dollar of investment as the size of transactions increases is called diversification.", "t": false}, {"q": "An important financial institution that assists in the initial sale of securities in the primary market is the mutual fund.", "t": false}, {"q": "High interest rates might cause a corporation to postpone building a new plant that would provide more jobs.", "t": true}, {"q": "An increase in interest rates would encourage saving because more can be earned in interest income.", "t": true}, {"q": "Anything that is generally accepted in payment for goods or services or in the repayment of debts is:", "o": ["Money", "Wealth", "Income", "Liabilities"]}, {"q": "Money is:", "o": ["Anything generally accepted in payment for goods, services or debts", "A flow of earnings per unit of time", "The total collection of pieces of property that store value", "Always based on a precious metal like gold or silver"]}, {"q": "A flow of earnings per unit of time is:", "o": ["Income", "Money", "Wealth", "Liabilities"]}, {"q": "A person's house is part of his:", "o": ["Wealth", "Money", "Income", "Liabilities"]}, {"q": "An individual's annual salary is his:", "o": ["Income", "Money", "Wealth", "Liabilities"]}, {"q": "A share of common stock is a claim on a corporation's:", "o": ["Earnings and assets", "Debt", "Liabilities", "Expenses"]}, {"q": "Well-functioning financial markets promote:", "o": ["Growth", "Inflation", "Deflation", "Unemployment"]}, {"q": "Poorly performing financial markets can be the cause of:", "o": ["Poverty", "Wealth", "Financial stability", "Financial expansion"]}, {"q": "The bond markets are important because they are:", "o": ["The markets where interest rates are determined", "The markets where foreign exchange rates are determined", "The markets where all borrowers get their funds", "The most widely followed financial markets in the United States"]}, {"q": "The price paid for the rental of borrowed funds is commonly referred to as the:", "o": ["Interest rate", "Aggregate price level", "Exchange rate", "Dividend"]}, {"q": "Of money's functions, the one that distinguishes money from other assets is its function as a:", "o": ["Medium of exchange", "Store of value", "Standard of deferred payment", "Unit of account"]}, {"q": "Which of the following involves direct finance?", "o": ["People buy shares of common stock in the primary markets", "A corporation takes out loans from a bank", "A corporation buys a short-term corporate security in a secondary market", "People buy shares in a mutual fund"]}, {"q": "One purpose of regulation of financial markets is to:", "o": ["Promote information for shareholders, depositors and the public", "Limit the profits of financial institutions", "Increase competition among financial institutions", "Guarantee that maximum interest rates are paid on deposits"]}, {"q": "Financial markets promote economic efficiency by:", "o": ["Channelling funds from savers to investors", "Channelling funds from investors to savers", "Creating inflation", "Reducing investment"]}, {"q": "Stock prices are:", "o": ["Extremely volatile", "Relatively stable, trending upward at a steady pace", "Relatively stable, trending downward at a moderate rate", "Unstable, trending downward at a moderate rate"]}, {"q": "Currency includes:", "o": ["Paper money and coins", "Paper money, coins and cheques", "Paper money and cheques", "Paper money, coins, cheques and savings deposits"]}, {"q": "Property that is pledged to the lender in case a borrower cannot make his debt payments is called:", "o": ["Collateral", "Points", "Interest", "Good-faith money"]}, {"q": "The reduction in transaction costs per dollar of investment as the size of transactions increases is:", "o": ["Economies of scale", "Discounting", "Economies of trade", "Diversification"]}, {"q": "When a person makes a deposit at a bank, this is considered:", "o": ["Indirect finance", "Direct finance", "A mortgage", "A bond issuance"]}, {"q": "Everything else held constant, a decline in interest rates will cause spending on housing to:", "o": ["Rise", "Fall", "Remain unchanged", "Either rise, fall, or remain the same"]}];

(function(){
  const $ = id => document.getElementById(id);
  const total = QUESTIONS.length;
  document.querySelectorAll('[data-logo]').forEach(i=>i.src=$('logoMain').src);
  const tfCount = QUESTIONS.filter(x => typeof x.t === 'boolean').length;
  $('sTotal').textContent = total; $('sTF').textContent = tfCount; $('sMC').textContent = total - tfCount;

  let order = [], idx = 0, score = 0, streak = 0;

  function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
  function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $(id).classList.add('active'); window.scrollTo({top:0,behavior:'smooth'}); }

  function start(){
    order = shuffle(QUESTIONS); idx = 0; score = 0; streak = 0;
    $('scoreNow').textContent = 0; show('quiz'); render();
  }

  function render(){
    const item = order[idx];
    const isTF = typeof item.t === 'boolean';
    $('progress').textContent = 'Question ' + (idx+1) + ' of ' + total;
    $('barFill').style.width = (idx/total*100) + '%';
    $('qType').textContent = isTF ? 'True / False' : 'Multiple Choice';
    $('qText').textContent = item.q;
    const fb = $('fb'); fb.className = 'fb'; fb.innerHTML = '';
    $('nextBtn').classList.remove('show');
    $('nextBtn').textContent = idx === total-1 ? 'See my score' : 'Next question';
    const box = $('opts'); box.innerHTML = ''; box.className = 'opts' + (isTF ? ' tf' : '');

    let choices;
    if(isTF){ choices = [{text:'True', ok:item.t===true},{text:'False', ok:item.t===false}]; }
    else { choices = shuffle(item.o.map((t,i)=>({text:t, ok:i===0}))); }

    choices.forEach((c,i)=>{
      const b = document.createElement('button');
      b.className = 'opt'; b.type = 'button';
      const k = document.createElement('span'); k.className='k'; k.textContent = isTF ? (i===0?'T':'F') : 'ABCD'[i];
      const s = document.createElement('span'); s.textContent = c.text;
      b.append(k,s); b.dataset.ok = c.ok ? '1':'0';
      b.addEventListener('click',()=>answer(b,item));
      box.appendChild(b);
    });
  }

  function answer(btn,item){
    const all = [...$('opts').children];
    all.forEach(b=>b.disabled=true);
    const right = btn.dataset.ok === '1';
    all.forEach(b=>{
      if(b.dataset.ok==='1') b.classList.add('correct');
      else if(b!==btn) b.classList.add('dim');
    });
    btn.classList.add('picked');
    if(!right) btn.classList.add('wrong');
    const fb = $('fb');
    const correctText = all.find(b=>b.dataset.ok==='1').lastChild.textContent;
    if(right){ score++; streak++; fb.className='fb show ok'; fb.innerHTML = '<strong>Correct!</strong>'; }
    else { streak=0; fb.className='fb show no'; fb.innerHTML = '<strong>Not quite. The correct answer is: </strong>'; fb.querySelector('strong').append(document.createTextNode(correctText)); }
    
    $('scoreNow').textContent = score;
    const st = $('streak');
    if(streak>=3){ st.textContent = '\u{1F525} ' + streak + ' in a row!'; st.classList.add('on'); } else st.classList.remove('on');
    $('barFill').style.width = ((idx+1)/total*100) + '%';
    $('nextBtn').classList.add('show');
    $('nextBtn').focus({preventScroll:true});
  }

  function next(){ idx++; if(idx<total) { render(); window.scrollTo({top:0,behavior:'smooth'}); } else finish(); }

  function finish(){
    show('result');
    const pct = Math.round(score/total*100);
    $('finalScore').textContent = score + '/' + total;
    $('finalPct').textContent = pct + '%';
    const arc = $('ringArc'); arc.style.strokeDashoffset = 515.2;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ arc.style.strokeDashoffset = 515.2*(1-score/total); }));
    let v,m;
    if(pct>=90){v='Outstanding!';m='Excellent command of the material. You are exam-ready.';}
    else if(pct>=75){v='Very Good!';m='Strong performance. Review the few points you missed.';}
    else if(pct>=50){v='Good Effort';m='You are on the right track. Restart and aim higher.';}
    else {v='Keep Practising';m='Review the topics and try again; every attempt builds mastery.';}
    $('verdict').textContent=v; $('verdictMsg').textContent=m;
    if(pct>=75) confetti();
  }

  function confetti(){
    const c=document.createElement('div'); c.className='confetti'; document.body.appendChild(c);
    const cols=['#e6c776','#c9a24a','#1f5fbf','#f4ecd8','#b3261e'];
    for(let i=0;i<90;i++){ const p=document.createElement('i'); p.style.left=Math.random()*100+'vw';
      p.style.background=cols[i%cols.length]; p.style.animationDuration=(2.2+Math.random()*2.2)+'s'; p.style.animationDelay=(Math.random()*.8)+'s'; c.appendChild(p); }
    setTimeout(()=>c.remove(),5500);
  }

  $('startBtn').addEventListener('click',start);
  $('nextBtn').addEventListener('click',next);
  $('restartBtn').addEventListener('click',start);
})();
</script>
</body>
</html>
